name: Publish Physics II course
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: physics-ii-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check one version across the course and release
        shell: bash
        run: |
          test "v$(node -p 'require("./site/version.json").version')" = "$GITHUB_REF_NAME"
          test "$(node -p 'require("./android/package.json").version')" = "$(node -p 'require("./site/version.json").version')"
      - uses: ./.github/actions/build-circuitjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Android wrapper dependencies
        working-directory: android
        run: npm ci
      - name: Generate Android project
        working-directory: android
        run: npx cap add android
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/physics-ii.p12"
      - name: Build signed offline APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/physics-ii.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          node configure.cjs
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Physics-II-Android.apk"
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose Physics-II-Android.apk"
      - name: Package offline computer ZIP
        run: |
          mkdir -p dist/Physics-II-Interactive-Course
          cp -R site/. dist/Physics-II-Interactive-Course/
          cd dist
          zip -q -r "$GITHUB_WORKSPACE/Physics-II-Interactive-Course.zip" Physics-II-Interactive-Course
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish matching downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Physics-II-Interactive-Course.zip Physics-II-Android.apk --title "Physics II Interactive Course $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest
