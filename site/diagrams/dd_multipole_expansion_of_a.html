<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Magnetic Dipole Vector Potential</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #0ff;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            pointer-events: auto; /* Ensure sliders are clickable */
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        p {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #f0f;
        }

        input[type="range"] {
            width: 100%;
            background: #333;
            height: 6px;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px #0f0;
        }

        .formula {
            font-family: 'Courier New', Courier, monospace;
            background: #111;
            padding: 5px;
            border-radius: 4px;
            color: #0f0;
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        #legend {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .color-box {
            width: 10px;
            height: 10px;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
    <!-- Importing Three.js via CDN as requested -->
    <script src="../vendor/three-legacy/three.min.js"></script>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>Dipole Vector Potential</h1>
        <div class="formula">A(r) ~ (m × r) / r³</div>
        <p>
            Visualizing the magnetic vector potential <b>A</b> generated by a dipole <b>m</b> (Lime Arrow). 
            The magnitude falls off as 1/r².
        </p>

        <div class="control-group">
            <label for="momentRange">Dipole Strength (m)</label>
            <input type="range" id="momentRange" min="1" max="10" step="0.1" value="5">
        </div>

        <div class="control-group">
            <label for="scaleRange">Vector Length Scale</label>
            <input type="range" id="scaleRange" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div id="legend">
            <span><span class="color-box" style="background:#0ff;"></span>Strong Field</span>
            <span><span class="color-box" style="background:#f0f;"></span>Weak Field</span>
        </div>
        <p style="font-size: 0.8rem; margin-top:15px; color:#666;">
            * Left Click + Drag to Rotate<br>
            * Scroll to Zoom
        </p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        
        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Dark Mode
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 2. Lighting & Helpers ---
        // Ambient light for general visibility
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // Point lights to make the dipole shiny
        const light1 = new THREE.PointLight(0xffffff, 1, 100);
        light1.position.set(10, 10, 10);
        scene.add(light1);
        const light2 = new THREE.PointLight(0x00ffff, 0.5, 100);
        light2.position.set(-10, -10, -10);
        scene.add(light2);

        // A root group to hold everything we want to rotate
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // Grid Helper (Subtle)
        const gridHelper = new THREE.GridHelper(20, 20, 0x222222, 0x111111);
        worldGroup.add(gridHelper);

        // --- 3. The Dipole Object (The Source) ---
        // Represented as a Lime Green Arrow pointing up Y axis
        const dipoleGroup = new THREE.Group();
        const cylinderGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.5, 16);
        const coneGeo = new THREE.ConeGeometry(0.25, 0.5, 16);
        const dipoleMat = new THREE.MeshStandardMaterial({ 
            color: 0x0f0, 
            emissive: 0x004400,
            metalness: 0.8,
            roughness: 0.2
        });

        const cylinder = new THREE.Mesh(cylinderGeo, dipoleMat);
        cylinder.position.y = 0; // Centered
        
        const cone = new THREE.Mesh(coneGeo, dipoleMat);
        cone.position.y = 0.75 + 0.25; // On top of cylinder

        dipoleGroup.add(cylinder);
        dipoleGroup.add(cone);
        worldGroup.add(dipoleGroup);

        // --- 4. The Vector Field ---
        const arrows = [];
        const vectorGroup = new THREE.Group();
        worldGroup.add(vectorGroup);

        // Configuration for grid
        const gridSize = 3; // range -3 to 3
        const step = 0.8;   // spacing

        // Pre-generate ArrowHelpers
        // We reuse these arrows and just update direction/length/color
        function initField() {
            const dir = new THREE.Vector3(1, 0, 0);
            const origin = new THREE.Vector3(0, 0, 0);
            const len = 1;
            const col = 0xffff00;

            for (let x = -gridSize; x <= gridSize; x += step) {
                for (let y = -gridSize; y <= gridSize; y += step) {
                    for (let z = -gridSize; z <= gridSize; z += step) {
                        // Skip origin to avoid singularity
                        const dist = Math.sqrt(x*x + y*y + z*z);
                        if (dist < 0.6) continue;

                        const arrowHelper = new THREE.ArrowHelper(dir, origin, len, col);
                        arrowHelper.position.set(x, y, z);
                        
                        // Store metadata for update
                        arrowHelper.userData = {
                            pos: new THREE.Vector3(x, y, z)
                        };
                        
                        vectorGroup.add(arrowHelper);
                        arrows.push(arrowHelper);
                    }
                }
            }
        }

        initField();

        // --- 5. Physics Logic & Update ---
        
        function updateVectors() {
            const mStrength = parseFloat(document.getElementById('momentRange').value);
            const scaleFactor = parseFloat(document.getElementById('scaleRange').value);
            
            // Dipole moment m is along Y axis: m = (0, mStrength, 0)
            const mVec = new THREE.Vector3(0, mStrength, 0);

            // Reusable vectors to avoid GC
            const rVec = new THREE.Vector3();
            const crossVec = new THREE.Vector3();
            const color1 = new THREE.Color(0x00ffff); // Cyan (High)
            const color2 = new THREE.Color(0xff00ff); // Magenta (Low)

            let maxMag = 0;

            // First pass: Calculate vectors and find max magnitude for normalization (optional, but good for coloring)
            // But A falls off as 1/r^2, so close points are huge, far points tiny.
            // We clamp visualization length but map color to actual magnitude.

            arrows.forEach(arrow => {
                rVec.copy(arrow.userData.pos);
                const r = rVec.length();

                // Physics: A = (m x r) / r^3
                // direction is m x r
                crossVec.crossVectors(mVec, rVec);
                
                // Magnitude of A = |m||r|sin(theta) / r^3 = m sin(theta) / r^2
                // crossVec has length |m||r|sin(theta). 
                // We need to divide by r^3 to get true A.
                const factor = 1 / (r * r * r);
                
                // The true Vector Potential A
                const Ax = crossVec.x * factor;
                const Ay = crossVec.y * factor;
                const Az = crossVec.z * factor;
                
                const mag = Math.sqrt(Ax*Ax + Ay*Ay + Az*Az);

                // Update Arrow Direction (normalized)
                // Note: setDirection must be normalized
                if (mag > 0.0001) {
                    const dir = new THREE.Vector3(Ax, Ay, Az).normalize();
                    arrow.setDirection(dir);
                }

                // Update Length (Visual representation)
                // We don't want 1/r^2 scaling for length literally because far arrows disappear.
                // We apply a softer scaling for visualization or clamp it.
                // Let's scale length by magnitude but clamp it to keep grid tidy.
                let visualLen = mag * scaleFactor;
                if (visualLen > 0.8) visualLen = 0.8; // Cap length to avoid overlap
                if (visualLen < 0.1) visualLen = 0.1; // Min length
                
                arrow.setLength(visualLen, visualLen * 0.3, visualLen * 0.2); // length, headLength, headWidth

                // Color Mapping
                // Map magnitude to color. Since it's 1/r^2, value drops fast.
                // We use log scale for better color distribution.
                // Near source ~ m/0.5^2 ~ 4m. Far source ~ m/5^2 ~ m/25.
                // Range is roughly 0.1 to 20.
                
                // Normalized val 0..1
                let t = Math.min(1, mag * 2.0 / mStrength); 
                // Lerp color: High field (Cyan) -> Low field (Magenta)
                // Actually let's flip: Cyan for strong, Magenta for weak (per typical neon aesthetics)
                const finalColor = color2.clone().lerp(color1, t); // Magenta to Cyan
                
                arrow.setColor(finalColor);
            });
        }

        // Initial call
        updateVectors();

        // Listeners
        document.getElementById('momentRange').addEventListener('input', updateVectors);
        document.getElementById('scaleRange').addEventListener('input', updateVectors);

        // --- 6. Interaction (Camera Orbit) ---
        // Simple drag to rotate implementation
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationTarget = { x: 0, y: 0 }; // Target rotation
        let rotationCurrent = { x: 0, y: 0 }; // Smoothed rotation

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        container.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };

                // Rotate the worldGroup
                rotationTarget.x += deltaMove.x * 0.005;
                rotationTarget.y += deltaMove.y * 0.005;

                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            }
        });

        container.addEventListener('mouseup', () => isDragging = false);
        container.addEventListener('mouseleave', () => isDragging = false);

        // Zoom
        container.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.01;
            camera.position.x += e.deltaY * 0.01;
            // Clamp zoom
            camera.position.z = Math.max(2, Math.min(camera.position.z, 20));
            camera.position.x = Math.max(2, Math.min(camera.position.x, 20));
        });

        // --- 7. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Smooth rotation logic
            rotationCurrent.x += (rotationTarget.x - rotationCurrent.x) * 0.1;
            rotationCurrent.y += (rotationTarget.y - rotationCurrent.y) * 0.1;

            worldGroup.rotation.y = rotationCurrent.x;
            worldGroup.rotation.x = rotationCurrent.y;

            // Slow auto-rotation if idle
            if (!isDragging) {
                rotationTarget.x += 0.001;
            }

            // Always look at origin
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
