<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Divergence Visualizer</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(28, 39, 52, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a4a5c;
            width: 250px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        h2 { margin: 0 0 15px 0; font-size: 1.1rem; color: #3498db; border-bottom: 1px solid #3a4a5c; padding-bottom: 5px; }

        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #b0c4de; }
        
        select {
            width: 100%;
            padding: 8px;
            background-color: #121a23;
            border: 1px solid #3a4a5c;
            color: white;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select:focus { outline: 2px solid #3498db; }

        .legend {
            margin-top: 15px;
            font-size: 0.85rem;
            border-top: 1px solid #3a4a5c;
            padding-top: 10px;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .color-box { width: 15px; height: 15px; border-radius: 3px; margin-right: 10px; }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #555;
            display: none;
            z-index: 100;
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
        
        <div class="controls">
            <h2>Vector Field Select</h2>
            
            <div class="control-group">
                <label for="fieldSelect">Choose a Field:</label>
                <select id="fieldSelect">
                    <option value="source">Point Source (+)</option>
                    <option value="sink">Point Sink (-)</option>
                    <option value="rotation">Pure Rotation (Curl)</option>
                    <option value="uniform">Uniform Field</option>
                    <option value="expansionX">Expansion in X only</option>
                    <option value="saddle">Saddle Point</option>
                </select>
            </div>

            <div class="legend">
                <div style="margin-bottom: 5px; font-weight: bold; color: #fff;">Divergence Map:</div>
                <div class="legend-item">
                    <div class="color-box" style="background: rgba(231, 76, 60, 0.8)"></div>
                    <span>Positive (Source)</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background: rgba(46, 204, 113, 0.2)"></div>
                    <span>Zero</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background: rgba(52, 152, 219, 0.8)"></div>
                    <span>Negative (Sink)</span>
                </div>
            </div>
        </div>

        <div id="tooltip" class="tooltip"></div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        const container = document.getElementById('canvas-container');

        let width, height;
        const gridSize = 30; // Spacing between vectors
        let currentField = 'source';

        // --- Field Definitions ---
        // Returns vector {x, y} and divergence val at position (px, py)
        // Coordinates are centered at (0,0)
        const fields = {
            source: (x, y) => {
                const r = Math.sqrt(x*x + y*y);
                // E ~ r (Uniform sphere of charge inside) for visualization simplicity
                // Or E ~ 1/r^2. Let's do E ~ r / (r^2 + c) to avoid singularity at 0
                const mag = 1 / (1 + 0.005 * r * r); 
                return { vx: x * mag, vy: y * mag, div: 2 * mag - (0.01 * r * r * mag * mag) }; // Approx
            },
            sink: (x, y) => {
                const f = fields.source(x, y);
                return { vx: -f.vx, vy: -f.vy, div: -f.div };
            },
            rotation: (x, y) => {
                // F = -y i + x j
                return { vx: -y * 0.5, vy: x * 0.5, div: 0 };
            },
            uniform: (x, y) => {
                return { vx: 50, vy: 0, div: 0 };
            },
            expansionX: (x, y) => {
                // F = x i
                return { vx: x * 0.8, vy: 0, div: 0.8 };
            },
            saddle: (x, y) => {
                // F = x i - y j
                return { vx: x * 0.5, vy: -y * 0.5, div: 0 }; // 0.5 - 0.5 = 0
            }
        };

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            draw();
        }

        function drawArrow(x, y, vx, vy, color) {
            const len = Math.sqrt(vx*vx + vy*vy);
            if (len < 1) return;
            
            // Scale down for visual clarity
            const scale = Math.min(gridSize * 0.8, len) / len;
            const dx = vx * scale;
            const dy = vy * scale;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + dx, y + dy);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Arrowhead
            const angle = Math.atan2(dy, dx);
            const headLen = 5;
            ctx.beginPath();
            ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - headLen * Math.cos(angle - Math.PI / 6), y + dy - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x + dx - headLen * Math.cos(angle + Math.PI / 6), y + dy - headLen * Math.sin(angle + Math.PI / 6));
            ctx.fillStyle = color;
            ctx.fill();
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const fieldFunc = fields[currentField];

            // 1. Draw Divergence Heatmap
            // We scan pixels or small blocks. For performance, blocks matching grid size.
            for (let x = 0; x < width; x += 5) {
                for (let y = 0; y < height; y += 5) {
                    const worldX = x - centerX;
                    const worldY = y - centerY;
                    
                    // Calculate analytical divergence or approximate it
                    // For simplicity in this visualizer, we define the div in the field function
                    const data = fieldFunc(worldX, worldY);
                    const div = data.div;

                    if (Math.abs(div) > 0.01) {
                        let color;
                        const alpha = Math.min(0.6, Math.abs(div) * 0.8); // Intensity based on magnitude
                        if (div > 0) {
                            ctx.fillStyle = `rgba(231, 76, 60, ${alpha})`; // Red
                        } else {
                            ctx.fillStyle = `rgba(52, 152, 219, ${alpha})`; // Blue
                        }
                        ctx.fillRect(x, y, 5, 5);
                    }
                }
            }

            // 2. Draw Vector Field
            for (let x = 0; x < width; x += gridSize) {
                for (let y = 0; y < height; y += gridSize) {
                    const worldX = x - centerX;
                    const worldY = y - centerY;
                    
                    const data = fieldFunc(worldX, worldY);
                    drawArrow(x, y, data.vx, data.vy, '#ecf0f1');
                }
            }
        }

        // --- Interaction ---
        document.getElementById('fieldSelect').addEventListener('change', (e) => {
            currentField = e.target.value;
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const worldX = mx - width / 2;
            const worldY = my - height / 2;

            const data = fields[currentField](worldX, worldY);
            
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';
            
            let divText = data.div.toFixed(2);
            if (Math.abs(data.div) < 0.01) divText = "0.00";
            
            tooltip.innerHTML = `
                <div><strong>Pos:</strong> (${Math.round(worldX)}, ${Math.round(-worldY)})</div>
                <div style="margin-top:4px; border-top:1px solid #555; padding-top:4px;">
                    <strong>∇·E:</strong> <span style="color:${data.div > 0.01 ? '#e74c3c' : (data.div < -0.01 ? '#3498db' : '#fff')}">${divText}</span>
                </div>
            `;
        });

        canvas.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
        });

        window.addEventListener('resize', resize);
        
        // Init
        resize();

    </script>
</body>
</html>
