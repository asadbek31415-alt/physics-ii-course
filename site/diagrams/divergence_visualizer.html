<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divergence Visualizer</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #eee; }
        
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 40px;
            border: 1px solid #444;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .tool-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: #222;
            color: #fff;
        }

        .tool-btn:hover { transform: scale(1.1); }
        
        .tool-btn.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        #btn-source { background: #ff5252; } /* Red */
        #btn-sink { background: #448aff; }   /* Blue */
        #btn-clear { background: #555; font-size: 1rem; width: auto; padding: 0 20px; border-radius: 25px; }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h2 { margin: 0; font-size: 1.5rem; color: #fff; }
        p { margin: 5px 0 0; color: #bbb; font-size: 0.9rem; }

    </style>
    <script type="importmap">
        { "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
    </script>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="info">
        <h2>Divergence Playground</h2>
        <p>Click to place Sources (+) and Sinks (-)</p>
    </div>

    <div id="ui-container">
        <button id="btn-source" class="tool-btn active" title="Add Source (+)">+</button>
        <button id="btn-sink" class="tool-btn" title="Add Sink (-)">−</button>
        <button id="btn-clear" class="tool-btn" title="Clear All">Clear</button>
    </div>

    <script type="text/offline-module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        
        // Top-down Orthographic camera for 2D feel, but still 3D
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 20;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2, frustumSize * aspect / 2,
            frustumSize / 2, frustumSize / -2,
            1, 1000
        );
        camera.position.set(0, 20, 0);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // --- STATE ---
        const charges = []; // { mesh, q, pos }
        let currentTool = 1; // 1 = Source, -1 = Sink
        const arrowGrid = [];
        
        // --- INTERACTION PLANE ---
        const planeGeo = new THREE.PlaneGeometry(40, 40);
        const planeMat = new THREE.MeshBasicMaterial({ visible: false }); // Invisible raycast target
        const rayPlane = new THREE.Mesh(planeGeo, planeMat);
        rayPlane.rotation.x = -Math.PI / 2;
        scene.add(rayPlane);

        // Grid Helper
        const grid = new THREE.GridHelper(40, 40, 0x333333, 0x111111);
        scene.add(grid);

        // --- ARROW FIELD SETUP ---
        const gridSize = 20;
        const spacing = 1.5;
        const offset = (gridSize * spacing) / 2;

        for(let i = 0; i < gridSize; i++) {
            for(let j = 0; j < gridSize; j++) {
                const x = (i * spacing) - offset + (spacing/2);
                const z = (j * spacing) - offset + (spacing/2);
                const origin = new THREE.Vector3(x, 0, z);
                
                // Create Arrow
                const dir = new THREE.Vector3(1, 0, 0);
                const arrow = new THREE.ArrowHelper(dir, origin, 0.8, 0x333333, 0.3, 0.2);
                scene.add(arrow);
                arrowGrid.push({ helper: arrow, pos: origin });
            }
        }

        // --- FUNCTIONS ---

        function createCharge(pos, q) {
            const geo = new THREE.SphereGeometry(0.4, 16, 16);
            const color = q > 0 ? 0xff5252 : 0x448aff;
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            // Glow
            const light = new THREE.PointLight(color, 2, 5);
            mesh.add(light);

            scene.add(mesh);
            charges.push({ mesh, q, pos });
            updateField();
        }

        function updateField() {
            arrowGrid.forEach(item => {
                const E = new THREE.Vector3(0, 0, 0);
                let maxMag = 0;

                // Superposition
                charges.forEach(c => {
                    const rVec = new THREE.Vector3().subVectors(item.pos, c.pos);
                    const distSq = rVec.lengthSq();
                    if(distSq < 0.1) return; // Avoid singularity
                    
                    // E = k * q / r^2
                    const mag = c.q / distSq;
                    rVec.normalize().multiplyScalar(mag);
                    E.add(rVec);
                });

                const len = E.length();
                
                if (len < 0.01) {
                    // Idle state
                    item.helper.setColor(0x333333);
                    item.helper.setLength(0.5);
                } else {
                    // Active state
                    const dir = E.normalize();
                    item.helper.setDirection(dir);
                    
                    // Clamp length visually
                    const visualLen = Math.min(1.2, len * 3); 
                    item.helper.setLength(visualLen, visualLen*0.3, visualLen*0.2);

                    // Color based on divergence source
                    // Simple heuristic: if pointing away from center of mass of + charges -> Redish
                    // This is just for visual flair
                    const color = new THREE.Color();
                    const t = Math.min(1, len * 2);
                    // Interpolate Grey -> White -> Color
                    color.setHSL(0.6, 0, 0.2 + t * 0.8); 
                    item.helper.setColor(color);
                }
            });
        }

        function clearCharges() {
            charges.forEach(c => scene.remove(c.mesh));
            charges.length = 0;
            updateField();
        }

        // --- INPUT HANDLING ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            // Only handle clicks on canvas, not UI
            if(event.target.tagName === 'BUTTON') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(rayPlane);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                point.y = 0; // Flatten to plane
                createCharge(point, currentTool);
            }
        });

        // UI Buttons
        document.getElementById('btn-source').onclick = (e) => {
            currentTool = 1;
            updateUI(e.target);
        };
        document.getElementById('btn-sink').onclick = (e) => {
            currentTool = -1;
            updateUI(e.target);
        };
        document.getElementById('btn-clear').onclick = clearCharges;

        function updateUI(activeBtn) {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        // --- ANIMATION ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Gentle pulse for charges
            const time = Date.now() * 0.005;
            charges.forEach(c => {
                const scale = 1 + 0.1 * Math.sin(time);
                c.mesh.scale.setScalar(scale);
            });

            renderer.render(scene, camera);
        }
        
        // Init with one source
        createCharge(new THREE.Vector3(-5, 0, 0), 1);
        animate();

    </script>
<script defer data-offline-bundle src="divergence_visualizer.0.offline.js"></script>


</body>
</html>
