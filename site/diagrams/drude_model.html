<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drude Model: Acceleration & Collisions</title>
    
    <style>
        :root {
            --bg-color: #0b1016;
            --panel-bg: #16212e;
            --accent-blue: #3498db;
            --accent-red: #e74c3c;
            --text-color: #e0e0e0;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #1c2734 0%, #0b1016 100%);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 33, 46, 0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 200px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #2c3e50;
            border-radius: 2px;
            appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
        }

        .mode-btn {
            background: #2c3e50;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
            transition: background 0.2s;
        }

        .mode-btn:hover {
            background: #34495e;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>

<body>

    <div id="controls">
        <label>Electric Field ($E$)</label>
        <div class="control-group">
            <input type="range" id="e-slider" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="mode-btn" id="reset-btn">Reset Simulation</div>

        <div style="margin-top:15px; font-size: 0.8rem; line-height: 1.4;">
            <span style="color: var(--accent-blue)">Blue dots</span> are electrons accelerating right.
            <br>
            <span style="color: #666">Gray circles</span> are lattice ions.
        </div>
    </div>

    <div class="legend">
        Note: Drift velocity is the <strong>average</strong> of these accelerations.
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const eSlider = document.getElementById('e-slider');
        const resetBtn = document.getElementById('reset-btn');

        let width, height;
        const ions = [];
        const electrons = [];
        const ionCount = 40;
        const electronCount = 25;
        const ionRadius = 15;
        const electronRadius = 4;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init();
        }

        class Ion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.glow = 0;
            }

            draw() {
                // Background glow if hit
                if (this.glow > 0) {
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, ionRadius * 2);
                    grad.addColorStop(0, `rgba(231, 76, 60, ${this.glow * 0.4})`);
                    grad.addColorStop(1, 'rgba(231, 76, 60, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, ionRadius * 2, 0, Math.PI * 2);
                    ctx.fill();
                    this.glow *= 0.9;
                }

                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, ionRadius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#1c2734';
                ctx.fill();
            }
        }

        class Electron {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2; // Thermal component
                this.vy = (Math.random() - 0.5) * 2;
                this.ax = 0;
            }

            update(E) {
                // Constant acceleration from E-field (pointing right)
                this.ax = E * 0.15;
                this.vx += this.ax;

                // Thermal noise (collisions with smaller things or just jitter)
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;

                this.x += this.vx;
                this.y += this.vy;

                // Collision with boundaries
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                if (this.y < 0) this.y = height;

                // Collision with ions
                ions.forEach(ion => {
                    const dx = this.x - ion.x;
                    const dy = this.y - ion.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < ionRadius + electronRadius) {
                        // Collision! Reset velocity randomly (Drude model)
                        this.vx = (Math.random() - 0.5) * 1.5;
                        this.vy = (Math.random() - 0.5) * 1.5;
                        ion.glow = 1.0;

                        // Push out of ion to prevent sticking
                        const angle = Math.atan2(dy, dx);
                        this.x = ion.x + (ionRadius + electronRadius + 1) * Math.cos(angle);
                        this.y = ion.y + (ionRadius + electronRadius + 1) * Math.sin(angle);
                    }
                });
            }

            draw() {
                ctx.fillStyle = '#3498db';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#3498db';
                ctx.beginPath();
                ctx.arc(this.x, this.y, electronRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            ions.length = 0;
            electrons.length = 0;

            // Grid-ish placement of ions with jitter
            const cols = 8;
            const rows = 5;
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = (width / (cols + 1)) * (i + 1) + (Math.random() - 0.5) * 40;
                    const y = (height / (rows + 1)) * (j + 1) + (Math.random() - 0.5) * 40;
                    ions.push(new Ion(x, y));
                }
            }

            for (let i = 0; i < electronCount; i++) {
                electrons.push(new Electron());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            const E = parseFloat(eSlider.value);

            ions.forEach(ion => ion.draw());
            electrons.forEach(e => {
                e.update(E);
                e.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resetBtn.onclick = init;

        resize();
        animate();
    </script>
</body>

</html>
