<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferromagnetic Domains</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #eee;
            font-family: sans-serif;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: row;
            height: 100vh;
        }

        #visualizer {
            flex: 2;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        #graph-panel {
            flex: 1;
            background: #1c2734;
            border-left: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .arrow {
            position: absolute;
            width: 20px;
            height: 4px;
            background: #e74c3c;
            transform-origin: center;
            transition: transform 0.4s ease-out;
            /* Smooth domain rotation */
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3px;
            border-left: 8px solid #e74c3c;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        /* Domain coloring */
        .domain-bg {
            position: absolute;
            opacity: 0.3;
            transition: background-color 0.5s;
        }

        .controls {
            margin-top: auto;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #b0c4de;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #3498db;
        }

        canvas {
            background: #121a23;
            border: 1px solid #444;
            border-radius: 4px;
            width: 100%;
            height: 200px;
        }

        .readout {
            font-family: monospace;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .phase-label {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>

<body>

    <div id="container">
        <div id="visualizer">
            <!-- Domains generated by JS -->
        </div>

        <div id="graph-panel">
            <h3>Hysteresis Loop</h3>
            <canvas id="hysteresisCanvas" width="300" height="200"></canvas>
            <div class="readout">H: <span id="valH">0</span> | M: <span id="valM">0</span></div>
            <div id="phaseText" class="phase-label">Ferromagnetic Phase</div>

            <div class="controls">
                <label>Applied Field (H)</label>
                <input type="range" id="sliderH" min="-100" max="100" value="0">

                <label>Temperature (T)</label>
                <div style="position: relative;">
                    <input type="range" id="sliderT" min="0" max="100" value="10" list="temp-markers">
                    <datalist id="temp-markers">
                        <option value="80" label="Tc"></option>
                    </datalist>
                    <div
                        style="position: absolute; left: 80%; top: 25px; font-size: 10px; color: #e74c3c; transform: translateX(-50%);">
                        Tc</div>
                </div>
                <small style="color:#777">Curie Point at T = 80</small>
            </div>
        </div>
    </div>

    <script>
        const visualizer = document.getElementById('visualizer');
        const sliderH = document.getElementById('sliderH');
        const sliderT = document.getElementById('sliderT');
        const valH = document.getElementById('valH');
        const valM = document.getElementById('valM');
        const phaseText = document.getElementById('phaseText');
        const cvs = document.getElementById('hysteresisCanvas');
        const ctx = cvs.getContext('2d');

        // Grid Settings
        const rows = 10;
        const cols = 10;
        const cellSize = 50; // visual size

        // Physics State
        let spins = []; // 2D array of angles
        let domains = []; // Array of domain blocks (simplified)
        let history = []; // For plotting graph

        // Create Grid
        function init() {
            visualizer.innerHTML = '';
            spins = [];

            // Create 4 main domains initially for visual clarity
            // Top-Left, Top-Right, Bot-Left, Bot-Right
            const quadrants = [
                Math.random() * 6.28, Math.random() * 6.28,
                Math.random() * 6.28, Math.random() * 6.28
            ];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const el = document.createElement('div');
                    el.className = 'arrow';
                    el.style.left = (c * 8 + 10) + '%';
                    el.style.top = (r * 8 + 10) + '%';
                    visualizer.appendChild(el);

                    // Assign initial domain orientation
                    let qIdx = 0;
                    if (r < rows / 2 && c < cols / 2) qIdx = 0;
                    else if (r < rows / 2) qIdx = 1;
                    else if (c < cols / 2) qIdx = 2;
                    else qIdx = 3;

                    // Add some randomness
                    let angle = quadrants[qIdx] + (Math.random() - 0.5) * 0.5;

                    spins.push({
                        el: el,
                        baseAngle: angle,
                        currentAngle: angle,
                        r: r, c: c
                    });
                }
            }
        }

        function updatePhysics() {
            const H = parseInt(sliderH.value);
            const T = parseInt(sliderT.value);

            const hNorm = H / 100; // -1 to 1
            const tNorm = T / 100; // 0 to 1

            let totalM_x = 0;

            // Curie Point Logic
            if (T > 80) {
                phaseText.innerText = "Paramagnetic Phase (T > Tc)";
                phaseText.style.color = "#3498db";
            } else {
                phaseText.innerText = "Ferromagnetic Phase";
                phaseText.style.color = "#e74c3c";
            }

            spins.forEach(s => {
                // Target angle: 0 (Right) if H > 0, PI (Left) if H < 0
                // But we simulate hysteresis/stiffness

                // 1. Exchange Interaction (Neighbors) - Simplified
                // In a real sim, we'd average neighbors. Here, we assume 'baseAngle' remembers the domain.

                // 2. External Field H
                // H tries to force angle to 0.

                // 3. Thermal Noise
                const noise = (Math.random() - 0.5) * (tNorm * 10); // High noise above Tc

                // Physics Logic:
                // Calculate effective field on this spin
                // We model Hysteresis by modifying the 'baseAngle' slowly only if H is strong

                // Stiffness: How hard is it to rotate?
                const stiffness = (1.0 - tNorm);

                // If T > Tc, stiffness is 0, behaves like Paramagnet (follows H + noise)
                if (T > 80) {
                    // Paramagnetic:
                    // Random thermal kick + Weak alignment with field
                    s.currentAngle += (Math.random() - 0.5) * 3.0; // Random walk

                    // Torque to align with H: -H * sin(theta)
                    // This creates a positive slope in M vs H
                    let torque = -(H * 0.015) * Math.sin(s.currentAngle);
                    s.currentAngle += torque;

                } else {
                    // Ferromagnetic
                    // If H is strong enough, it "breaks" the domain walls -> updates baseAngle
                    // Coercivity threshold approx 30
                    if (Math.abs(H) > 20) {
                        let target = (H > 0) ? 0 : Math.PI;
                        // Move base angle towards field
                        let rate = (Math.abs(H) - 20) * 0.002;
                        // Shortest path interpolation
                        let diff = target - s.baseAngle;
                        // Normalize diff
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;

                        s.baseAngle += diff * rate;
                    }

                    // The spin vibrates around its base angle + elastic stretch from H
                    let elasticStretch = hNorm * 0.5; // Bending within domain
                    s.currentAngle = s.baseAngle - elasticStretch + (noise * 0.1);
                }

                // Render
                s.el.style.transform = `rotate(${s.currentAngle}rad)`;

                // Calculate Magnetization (x-component projection)
                totalM_x += Math.cos(s.currentAngle);
            });

            // Normalize Total M (-1 to 1)
            let M = totalM_x / spins.length;

            // Update Readout
            valH.innerText = H;
            valM.innerText = M.toFixed(2);

            // Update Graph History
            // We plot (H, M)
            // Add point if H changed or just periodically
            if (history.length === 0 || Math.abs(history[history.length - 1].h - H) > 1 || Math.random() > 0.9) {
                history.push({ h: H, m: M });
                if (history.length > 300) history.shift();
            }

            drawGraph(H, M);
            requestAnimationFrame(updatePhysics);
        }

        function drawGraph(currH, currM) {
            ctx.fillStyle = '#121a23';
            ctx.fillRect(0, 0, 300, 200);

            // Axes
            ctx.strokeStyle = '#444';
            ctx.beginPath();
            ctx.moveTo(0, 100); ctx.lineTo(300, 100); // X axis (H)
            ctx.moveTo(150, 0); ctx.lineTo(150, 200); // Y axis (M)
            ctx.stroke();

            // Plot History
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 2;
            ctx.beginPath();
            history.forEach((p, i) => {
                // Map H (-100 to 100) -> x (0 to 300)
                let x = (p.h + 100) * (300 / 200);
                // Map M (-1 to 1) -> y (200 to 0)
                let y = 100 - (p.m * 90);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Current Point
            let cx = (currH + 100) * (300 / 200);
            let cy = 100 - (currM * 90);
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();

            // Labels
            ctx.fillStyle = "#aaa";
            ctx.font = "10px sans-serif";
            ctx.fillText("-H", 10, 115);
            ctx.fillText("+H", 280, 115);
            ctx.fillText("+M", 155, 10);
            ctx.fillText("-M", 155, 190);
        }

        init();
        updatePhysics();

    </script>
</body>

</html>
