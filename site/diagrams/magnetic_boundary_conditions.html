<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Boundary Conditions Visualization</title>
    <script src="../vendor/three-legacy/three.min.js"></script>
    <script src="../vendor/three-legacy/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        .label {
            position: absolute;
            color: #e2e8f0;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            color: #e2e8f0;
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>

<body>
    <div id="container"></div>
    <div class="controls">
        <label><input type="checkbox" id="togglePillbox" checked> Pillbox (Normal $\mathbf{B}$)</label><br>
        <label><input type="checkbox" id="toggleLoop" checked> Amperian Loop (Tangential $\mathbf{B}$)</label>
    </div>

    <script>
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // --- Surface ---
        const surfaceGeo = new THREE.PlaneGeometry(12, 12, 32, 32);
        const surfaceMat = new THREE.MeshPhongMaterial({
            color: 0x334155,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3,
            wireframe: false
        });
        const surface = new THREE.Mesh(surfaceGeo, surfaceMat);
        surface.rotation.x = Math.PI / 2;
        scene.add(surface);

        // Grid on surface
        const grid = new THREE.GridHelper(12, 12, 0x475569, 0x1e293b);
        grid.rotation.x = 0;
        scene.add(grid);

        // --- Surface Current K ---
        const kGroup = new THREE.Group();
        for (let z = -5; z <= 5; z += 2.5) {
            const arrow = new THREE.ArrowHelper(
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-4, 0.01, z),
                8, 0x3b82f6, 0.6, 0.3
            );
            kGroup.add(arrow);
        }
        scene.add(kGroup);

        // --- Pillbox ---
        const pillboxGroup = new THREE.Group();
        const boxGeo = new THREE.BoxGeometry(2, 1.5, 2);
        const boxMat = new THREE.MeshPhongMaterial({ color: 0x10b981, transparent: true, opacity: 0.4 });
        const box = new THREE.Mesh(boxGeo, boxMat);
        const boxEdges = new THREE.EdgesGeometry(boxGeo);
        const boxLines = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: 0x10b981 }));
        pillboxGroup.add(box, boxLines);
        pillboxGroup.position.set(-2.5, 0, 2);
        scene.add(pillboxGroup);

        // Normal B vectors
        const bAboveNorm = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0.75, 0), 2, 0x10b981, 0.4, 0.2);
        const bBelowNorm = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -2.75, 0), 2, 0x10b981, 0.4, 0.2);
        pillboxGroup.add(bAboveNorm, bBelowNorm);

        // --- Amperian Loop ---
        const loopGroup = new THREE.Group();
        const rectPoints = [];
        rectPoints.push(new THREE.Vector3(-1.5, 0.75, 0));
        rectPoints.push(new THREE.Vector3(1.5, 0.75, 0));
        rectPoints.push(new THREE.Vector3(1.5, -0.75, 0));
        rectPoints.push(new THREE.Vector3(-1.5, -0.75, 0));
        rectPoints.push(new THREE.Vector3(-1.5, 0.75, 0));
        const loopGeo = new THREE.BufferGeometry().setFromPoints(rectPoints);
        const loopMat = new THREE.LineBasicMaterial({ color: 0xfbbf24, linewidth: 2 });
        const loopLine = new THREE.Line(loopGeo, loopMat);
        loopGroup.add(loopLine);
        loopGroup.position.set(2.5, 0, -2);
        loopGroup.rotation.y = Math.PI / 2; // perpendicular to current
        scene.add(loopGroup);

        // Tangential B vectors
        const bAboveTang = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.75, 0.5), 2.5, 0xfbbf24, 0.4, 0.2);
        const bBelowTang = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, -0.75, -2.5), 2.5, 0xfbbf24, 0.4, 0.2);
        loopGroup.add(bAboveTang, bBelowTang);

        // --- UI Interactions ---
        document.getElementById('togglePillbox').onchange = (e) => pillboxGroup.visible = e.target.checked;
        document.getElementById('toggleLoop').onchange = (e) => loopGroup.visible = e.target.checked;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
