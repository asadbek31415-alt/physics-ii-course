<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polarization Vector Field Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
        }

        /* --- SIDEBAR UI --- */
        #sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 10;
            user-select: none;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            color: #22d3ee; /* Cyan 400 */
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .math-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #e2e8f0;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #22d3ee;
        }

        .hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 10px;
            font-style: italic;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        /* --- LEGEND (Bottom Left) --- */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            pointer-events: none;
            width: 290px; /* Match sidebar width approx */
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .legend-item:last-child { margin-bottom: 0; }

        .dot { width: 10px; height: 10px; border-radius: 50%; }

        canvas {
            display: block;
            cursor: crosshair; /* Hint that interaction is possible */
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <!-- Sidebar Controls -->
    <div id="sidebar">
        <h1>Polarization Vector (P)</h1>
        
        <div class="math-box">
            P = &Sigma; p<sub>i</sub> / Volume
        </div>

        <div class="control-group">
            <label>
                <span>External E-Field</span>
                <span id="val-e" style="color:#22d3ee">0.0</span>
            </label>
            <input type="range" id="slider-e" min="0" max="100" value="0">
        </div>

        <div class="control-group">
            <label>
                <span>Temperature (Chaos)</span>
                <span id="val-temp" style="color:#94a3b8">Low</span>
            </label>
            <input type="range" id="slider-temp" min="0" max="100" value="30">
        </div>

        <div class="hint">
            Move your mouse around the screen to rotate the External Field direction.
        </div>
    </div>

    <!-- Legend -->
    <div id="legend">
        <div class="legend-item">
            <div class="dot" style="background: #fbbf24"></div>
            <span>External E-Field Direction (Yellow)</span>
        </div>
        <div class="legend-item">
            <div class="dot" style="background: #22d3ee"></div>
            <span><b>P</b> Vector (Net Polarization)</span>
        </div>
        <div class="legend-item">
            <div class="dot" style="background: #94a3b8"></div>
            <span>Microscopic Dipoles</span>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const sliderE = document.getElementById('slider-e');
    const sliderTemp = document.getElementById('slider-temp');
    const labelE = document.getElementById('val-e');
    const labelTemp = document.getElementById('val-temp');

    let width, height;
    let molecules = [];
    
    // Physics State
    let E_mag = 0; // 0 to 1
    let E_angle = 0; // Radians
    let Temp = 0.3; 

    // Mouse Interaction
    let mouseX = window.innerWidth / 2 + 100; // Default pos
    let mouseY = window.innerHeight / 2;

    class Molecule {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = Math.random() * Math.PI * 2;
            this.angVel = 0;
            this.size = 14;
        }

        update() {
            // Physics: Torque = p x E = pE sin(theta)
            let angleDiff = E_angle - this.angle;
            
            // Normalize angle diff to -PI to PI
            while (angleDiff <= -Math.PI) angleDiff += Math.PI * 2;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

            // Torque
            const torque = Math.sin(angleDiff) * E_mag * 0.25;
            
            // Thermal Noise
            const noise = (Math.random() - 0.5) * Temp * 0.6;

            // Mechanics
            this.angVel += torque + noise;
            this.angVel *= 0.85; // Damping
            this.angle += this.angVel;
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // Opacity increases slightly with alignment to look "active"
            const alpha = 0.4 + (E_mag * 0.4);
            ctx.globalAlpha = alpha;

            // Connector
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#64748b";
            ctx.beginPath();
            ctx.moveTo(-this.size/2, 0);
            ctx.lineTo(this.size/2, 0);
            ctx.stroke();

            // Negative end (Blue)
            ctx.beginPath();
            ctx.arc(-this.size/2, 0, 3.5, 0, Math.PI*2);
            ctx.fillStyle = "#3b82f6";
            ctx.fill();

            // Positive end (Red)
            ctx.beginPath();
            ctx.arc(this.size/2, 0, 3.5, 0, Math.PI*2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();

            ctx.restore();
        }
    }

    function init() {
        resize();
        molecules = [];
        
        // Create grid
        const spacing = 45;
        // Start slightly offset so we don't clip edges
        const startX = 20;
        const startY = 20;
        
        const cols = Math.floor(width / spacing);
        const rows = Math.floor(height / spacing);

        for(let r = 0; r < rows; r++) {
            for(let c = 0; c < cols; c++) {
                // Jitter position for natural look
                const jx = (Math.random() - 0.5) * 15;
                const jy = (Math.random() - 0.5) * 15;
                molecules.push(new Molecule(
                    startX + c * spacing + jx, 
                    startY + r * spacing + jy
                ));
            }
        }
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    function updatePhysics() {
        // Read UI
        E_mag = parseInt(sliderE.value) / 100;
        Temp = parseInt(sliderTemp.value) / 100;

        // Update Labels
        labelE.innerText = E_mag.toFixed(2);
        if(Temp < 0.2) labelTemp.innerText = "Frozen";
        else if(Temp < 0.5) labelTemp.innerText = "Low";
        else if(Temp < 0.8) labelTemp.innerText = "Medium";
        else labelTemp.innerText = "High";

        // Calculate Angle
        const cx = width / 2;
        const cy = height / 2;
        // We only change angle if E_mag is relevant, otherwise keep last known or random
        if(E_mag > 0) {
            E_angle = Math.atan2(mouseY - cy, mouseX - cx);
        }

        molecules.forEach(m => m.update());
    }

    function getNetPolarization() {
        let Px = 0, Py = 0;
        molecules.forEach(m => {
            Px += Math.cos(m.angle);
            Py += Math.sin(m.angle);
        });
        
        // Normalize 0 to 1
        const count = molecules.length;
        return {
            x: Px / count,
            y: Py / count,
            mag: Math.sqrt((Px/count)**2 + (Py/count)**2)
        };
    }

    function drawArrow(x, y, vx, vy, color, scale, label, glow) {
        const len = Math.sqrt(vx*vx + vy*vy);
        if(len < 0.01) return;

        const endX = x + vx * scale;
        const endY = y + vy * scale;
        const angle = Math.atan2(vy, vx);

        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 6;
        if(glow) {
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
        }

        // Shaft
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // Head
        const headSize = 18;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headSize * Math.cos(angle - Math.PI / 6), endY - headSize * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(endX - headSize * Math.cos(angle + Math.PI / 6), endY - headSize * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();

        // Label
        if(label) {
            ctx.font = "bold 24px 'Segoe UI', sans-serif";
            ctx.fillStyle = "white";
            ctx.shadowBlur = 4;
            ctx.shadowColor = "black";
            // Place text slightly beyond arrow
            ctx.fillText(label, endX + (vx*20), endY + (vy*20));
        }

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        const cx = width / 2;
        const cy = height / 2;

        // 1. Draw Molecules
        molecules.forEach(m => m.draw(ctx));

        // 2. Draw Vectors (Center of Screen)
        const P = getNetPolarization();
        const arrowScale = 250; 

        // Draw External E Vector (Yellow)
        if(E_mag > 0.05) {
            const Ex = Math.cos(E_angle);
            const Ey = Math.sin(E_angle);
            // Offset slightly so it doesn't overlap P exactly
            drawArrow(cx - 20, cy - 20, Ex, Ey, "#fbbf24", arrowScale * E_mag, "E", false);
        }

        // Draw Polarization Vector P (Cyan)
        // P magnitude depends on alignment
        if(P.mag > 0.05) {
            drawArrow(cx, cy, P.x, P.y, "#22d3ee", arrowScale, "P", true);
            
            // Draw numeric value below
            ctx.font = "16px monospace";
            ctx.fillStyle = "#22d3ee";
            ctx.textAlign = "center";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 5;
            ctx.fillText(`|P| = ${P.mag.toFixed(2)}`, cx, cy + 60);
        }
    }

    // Handlers
    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    init();
    function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }
    loop();

</script>
</body>
</html>
