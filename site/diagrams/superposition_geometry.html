<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superposition Geometry</title>

    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <script defer src="../vendor/katex/katex.min.js"></script>
    <script defer src="../vendor/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            throwOnError: false
        });"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "../vendor/three/build/three.module.js",
                "three/addons/": "../vendor/three/examples/jsm/"
            }
        }
    </script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            position: relative;
        }

        #scene-stage {
            position: fixed;
            inset: 0;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        #scene-stage canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-panel {
            position: absolute;
            inset: 0 auto 0 0;
            z-index: 10;
            width: 312px;
            box-sizing: border-box;
            padding: 14px 16px;
            color: #e5e5e5;
            background: rgba(18, 18, 18, 0.96);
            border-right: 1px solid #333;
            box-shadow: 8px 0 32px rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(12px);
            user-select: none;
            overflow: hidden;
        }

        h2 {
            margin: 0 0 8px 0;
            color: #60a5fa;
            font-size: 15px;
            font-weight: 600;
        }

        .math-block {
            margin: 8px 0 10px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            text-align: center;
            font-size: 0.95rem;
        }

        .control-stack {
            display: grid;
            gap: 10px;
        }

        .slider-row {
            display: grid;
            gap: 5px;
            color: #d4d4d8;
            font-size: 12px;
            line-height: 1.35;
        }

        .slider-row label,
        .select-row label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #60a5fa;
        }

        select {
            width: 100%;
            min-height: 32px;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #e5e7eb;
            background: #18181b;
            font: inherit;
            font-size: 12px;
            padding: 6px 8px;
        }

        .legend {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 7px;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #333;
            color: #d4d4d8;
            font-size: 12px;
            line-height: 1.35;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        button {
            border: 1px solid #374151;
            background: #18181b;
            color: #e5e7eb;
            border-radius: 8px;
            padding: 8px 6px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            border-color: #60a5fa;
            color: #fff;
        }

        .math-label {
            color: #eee;
            font-size: 1.06rem;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 3px #000;
            white-space: nowrap;
        }

        .charge-label {
            padding: 2px 7px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.72);
        }

        @media (max-width: 760px) {
            body {
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) auto;
            }

            #scene-stage {
                position: relative;
                inset: auto;
                grid-column: 1;
                grid-row: 1;
                align-self: stretch;
            }

            #ui-panel {
                position: relative;
                inset: auto;
                grid-column: 1;
                grid-row: 2;
                width: 100%;
                max-height: none;
                padding: 8px 10px 10px;
                border-right: 0;
                border-top: 1px solid #333;
                overflow: hidden;
            }

            .math-block {
                display: none;
            }

            .control-stack {
                grid-template-columns: 1fr 1fr;
                gap: 5px 8px;
            }

            .slider-row {
                gap: 3px;
                font-size: 11px;
            }

            select {
                min-height: 28px;
            }

            .legend {
                grid-column: 1 / -1;
                grid-template-columns: auto 1fr auto 1fr;
                gap: 4px 6px;
                padding-top: 5px;
                font-size: 10.5px;
            }

            .button-grid,
            .preset-grid {
                grid-column: 1 / -1;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 5px;
                padding-top: 5px;
            }

            button {
                min-height: 34px;
                padding: 5px 3px;
                font-size: 10px;
            }
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>

<body>
    <div id="ui-panel">
        <h2>Superposition</h2>
        <div class="math-block">
            $$ \vec{F}_{net} = \vec{F}_1 + \vec{F}_2 + \cdots $$
        </div>

        <div class="control-stack">
            <div class="select-row slider-row">
                <label for="charge-select">
                    <span>Selected source</span>
                    <strong id="source-count">2 total</strong>
                </label>
                <select id="charge-select"></select>
            </div>

            <div class="slider-row">
                <label for="source-value">
                    <span>Source charge q<sub>i</sub></span>
                    <strong><span id="source-readout">+3</span> units</strong>
                </label>
                <input type="range" id="source-value" min="-5" max="5" step="1" value="3">
            </div>

            <div class="slider-row">
                <label for="test-value">
                    <span>Test charge Q</span>
                    <strong><span id="test-readout">+2</span> units</strong>
                </label>
                <input type="range" id="test-value" min="-5" max="5" step="1" value="2">
            </div>

            <div class="legend">
                <div class="dot" style="background:#ef4444;"></div>
                <div>Positive charge</div>

                <div class="dot" style="background:#3b82f6;"></div>
                <div>Negative charge</div>

                <div class="dot" style="background:#f59e0b;"></div>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-components" checked> Forces on Q
                </label>

                <div class="dot" style="background:#22d3ee;"></div>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-net" checked> Net force
                </label>
            </div>

            <div class="button-grid">
                <button type="button" id="add-positive">Add +</button>
                <button type="button" id="add-negative">Add -</button>
                <button type="button" id="remove-source">Remove</button>
                <button type="button" id="reset">Reset</button>
            </div>

            <div class="preset-grid">
                <button type="button" data-preset="zero">Net = 0</button>
                <button type="button" data-preset="vertical">Vertical cancels</button>
                <button type="button" data-preset="line">Line distribution</button>
                <button type="button" data-preset="near">Near dominates</button>
            </div>
        </div>
    </div>

    <script type="text/offline-module">
        import * as THREE from 'three';
        import { DragControls } from 'three/addons/controls/DragControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const d = 10;
        const camera = new THREE.OrthographicCamera(-d, d, d, -d, 0.1, 1000);
        camera.position.set(0, 0, 10);
        camera.lookAt(0, 0, 0);

        const uiPanel = document.getElementById('ui-panel');
        const stage = document.createElement('div');
        stage.id = 'scene-stage';
        document.body.insertBefore(stage, uiPanel);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        stage.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.inset = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        stage.appendChild(labelRenderer.domElement);

        const POSITIVE_COLOR = 0xef4444;
        const NEGATIVE_COLOR = 0x3b82f6;
        const COMPONENT_COLOR = 0xf59e0b;
        const NET_COLOR = 0x22d3ee;
        const sphereGeo = new THREE.SphereGeometry(0.42, 32, 32);

        const grid = new THREE.GridHelper(40, 40, 0x141414, 0x101010);
        grid.rotation.x = Math.PI / 2;
        scene.add(grid);

        const chargeSelect = document.getElementById('charge-select');
        const sourceCount = document.getElementById('source-count');
        const sourceSlider = document.getElementById('source-value');
        const sourceReadout = document.getElementById('source-readout');
        const testSlider = document.getElementById('test-value');
        const testReadout = document.getElementById('test-readout');
        const chkComponents = document.getElementById('chk-components');
        const chkNet = document.getElementById('chk-net');

        const sources = [];
        let selectedIndex = 0;
        let dragControls;

        function colorForCharge(value) {
            if (value === 0) return 0x94a3b8;
            return value >= 0 ? POSITIVE_COLOR : NEGATIVE_COLOR;
        }

        function cssColorForCharge(value) {
            if (value === 0) return '#94a3b8';
            return value >= 0 ? '#ef4444' : '#3b82f6';
        }

        function formatCharge(value) {
            return `${value > 0 ? '+' : ''}${value}`;
        }

        function renderMath(str) {
            if (window.katex) {
                try {
                    return katex.renderToString(str);
                } catch (e) {
                    return str;
                }
            }
            return str;
        }

        function makeLabel(text, color, extraClass = '') {
            const div = document.createElement('div');
            div.className = `math-label ${extraClass}`.trim();
            div.style.color = color;
            div.innerHTML = renderMath(text);
            const label = new CSS2DObject(div);
            scene.add(label);
            return label;
        }

        function setLabel(label, text, color) {
            label.element.style.color = color;
            label.element.innerHTML = renderMath(text);
        }

        function createArrow(color) {
            const arrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, color, 0.34, 0.22);
            scene.add(arrow);
            return arrow;
        }

        function setArrowLength(arrow, length, headRatio = 0.22) {
            const safe = Math.max(length, 0.05);
            const headLength = Math.min(Math.max(safe * headRatio, 0.16), 0.5);
            const headWidth = Math.min(Math.max(headLength * 0.7, 0.11), 0.32);
            arrow.setLength(safe, headLength, headWidth);
        }

        function labelOffsetForVector(vector, index) {
            if (vector.length() < 0.001) return new THREE.Vector3(0.18, 0.18, 0);
            const dir = vector.clone().normalize();
            const perpendicular = new THREE.Vector3(-dir.y, dir.x, 0);
            const side = index % 2 === 0 ? 1 : -1;
            return perpendicular.multiplyScalar(0.35 * side).add(new THREE.Vector3(0.12, 0.08, 0));
        }

        function makeCharge(value, position) {
            const material = new THREE.MeshBasicMaterial({ color: colorForCharge(value) });
            const mesh = new THREE.Mesh(sphereGeo, material);
            mesh.position.copy(position);
            scene.add(mesh);

            return {
                value,
                mesh,
                material,
                label: makeLabel('', '#ef4444', 'charge-label'),
                forceArrow: createArrow(COMPONENT_COLOR),
                forceLabel: makeLabel('\\vec{F}', '#f59e0b')
            };
        }

        const testCharge = makeCharge(2, new THREE.Vector3(4, 0, 0.1));
        scene.remove(testCharge.forceArrow, testCharge.forceLabel);
        setLabel(testCharge.label, 'Q', '#ef4444');

        const netArrow = createArrow(NET_COLOR);
        const netLabel = makeLabel('\\vec{F}_{net}', '#22d3ee');

        function resetSources() {
            while (sources.length) removeSource(sources.length - 1, false);
            testCharge.value = 5;
            testCharge.mesh.position.set(3.2, 0, 0.1);
            sources.push(makeCharge(5, new THREE.Vector3(-2.2, 2.2, 0.1)));
            sources.push(makeCharge(5, new THREE.Vector3(-2.2, -2.2, 0.1)));
            selectedIndex = 0;
            rebuildDragControls();
            syncUI();
            update();
        }

        function removeSource(index, shouldRebuild = true) {
            if (shouldRebuild && sources.length <= 1) return;
            const source = sources[index];
            [source.mesh, source.label, source.forceArrow, source.forceLabel].forEach(obj => {
                if (obj) scene.remove(obj);
            });
            source.material.dispose?.();
            sources.splice(index, 1);
            selectedIndex = Math.min(selectedIndex, sources.length - 1);
            if (shouldRebuild) {
                rebuildDragControls();
                syncUI();
                update();
            }
        }

        function addSource(value) {
            if (sources.length >= 4) return;
            const y = [-4.2, -1.4, 1.4, 4.2][sources.length] ?? 0;
            sources.push(makeCharge(value, new THREE.Vector3(-5.2, y, 0.1)));
            selectedIndex = sources.length - 1;
            rebuildDragControls();
            syncUI();
            update();
        }

        function setSources(configs) {
            while (sources.length) removeSource(sources.length - 1, false);
            configs.forEach(config => sources.push(makeCharge(config.value, new THREE.Vector3(config.x, config.y, 0.1))));
            selectedIndex = 0;
            rebuildDragControls();
            syncUI();
            update();
        }

        function applyPreset(name) {
            if (name === 'zero') {
                testCharge.value = 2;
                testCharge.mesh.position.set(0, 0, 0.1);
                setSources([
                    { value: 4, x: -4, y: 0 },
                    { value: 4, x: 4, y: 0 }
                ]);
            }
            if (name === 'vertical') {
                testCharge.value = 5;
                testCharge.mesh.position.set(3.2, 0, 0.1);
                setSources([
                    { value: 5, x: -2.2, y: 2.2 },
                    { value: 5, x: -2.2, y: -2.2 }
                ]);
            }
            if (name === 'line') {
                testCharge.value = 2;
                testCharge.mesh.position.set(0, 2.4, 0.1);
                setSources([
                    { value: 3, x: -5.4, y: 0 },
                    { value: 3, x: -1.8, y: 0 },
                    { value: 3, x: 1.8, y: 0 },
                    { value: 3, x: 5.4, y: 0 }
                ]);
            }
            if (name === 'near') {
                testCharge.value = 2;
                testCharge.mesh.position.set(4.2, 0, 0.1);
                setSources([
                    { value: 5, x: -5.2, y: 3.0 },
                    { value: 5, x: -5.2, y: -3.0 },
                    { value: -3, x: 1.5, y: 0 }
                ]);
            }
        }

        function rebuildDragControls() {
            dragControls?.dispose();
            dragControls = new DragControls([...sources.map(source => source.mesh), testCharge.mesh], camera, renderer.domElement);
            dragControls.addEventListener('drag', update);
        }

        function syncUI() {
            chargeSelect.innerHTML = '';
            sources.forEach((source, index) => {
                const option = document.createElement('option');
                option.value = String(index);
                option.textContent = `q${index + 1} (${formatCharge(source.value)})`;
                chargeSelect.appendChild(option);
            });
            chargeSelect.value = String(selectedIndex);
            sourceCount.textContent = `${sources.length} total`;
            sourceSlider.value = String(sources[selectedIndex].value);
            sourceReadout.textContent = formatCharge(sources[selectedIndex].value);
            testSlider.value = String(testCharge.value);
            testReadout.textContent = formatCharge(testCharge.value);
        }

        function forceVectorFrom(source) {
            const rVec = new THREE.Vector3().subVectors(testCharge.mesh.position, source.mesh.position);
            const distance = Math.max(rVec.length(), 0.001);
            const physical = Math.abs(source.value * testCharge.value) / (distance * distance);
            const visualLength = physical === 0 ? 0 : Math.max(4.2 * Math.pow(physical, 0.50), 0.95);
            const sign = Math.sign(source.value * testCharge.value) || 1;
            return rVec.normalize().multiplyScalar(sign * visualLength);
        }

        function update() {
            const selected = sources[selectedIndex];
            sources.forEach((source, index) => {
                source.material.color.setHex(colorForCharge(source.value));
                setLabel(source.label, `q_{${index + 1}}`, cssColorForCharge(source.value));
                source.label.position.copy(source.mesh.position).add(new THREE.Vector3(0, 1.05, 0));

                const forceVec = forceVectorFrom(source);
                const forceLength = forceVec.length();
                source.forceArrow.position.copy(testCharge.mesh.position);
                if (forceLength > 0.12) source.forceArrow.setDirection(forceVec.clone().normalize());
                setArrowLength(source.forceArrow, forceLength || 0.05, 0.2);
                source.forceArrow.visible = source.forceLabel.visible = chkComponents.checked && forceLength > 0.12;
                const labelOffset = labelOffsetForVector(forceVec, index);
                if (forceLength > 0.12) {
                    source.forceLabel.position.copy(testCharge.mesh.position).add(forceVec.clone().multiplyScalar(1.1)).add(labelOffset);
                }
                setLabel(source.forceLabel, `\\vec{F}_{${index + 1}}`, '#f59e0b');
            });

            testCharge.material.color.setHex(colorForCharge(testCharge.value));
            setLabel(testCharge.label, 'Q', cssColorForCharge(testCharge.value));
            testCharge.label.position.copy(testCharge.mesh.position).add(new THREE.Vector3(0, 1.05, 0));

            const net = sources.reduce((sum, source) => sum.add(forceVectorFrom(source)), new THREE.Vector3());
            const netLength = net.length();
            netArrow.position.copy(testCharge.mesh.position);
            if (netLength > 0) netArrow.setDirection(net.clone().normalize());
            setArrowLength(netArrow, netLength || 0.05, 0.22);
            netArrow.visible = netLabel.visible = chkNet.checked && netLength > 0.12;
            if (netLength > 0.12) {
                netLabel.position.copy(testCharge.mesh.position).add(net.clone().multiplyScalar(1.12)).add(new THREE.Vector3(0.12, -0.28, 0));
            }

            sourceSlider.value = String(selected.value);
            sourceReadout.textContent = formatCharge(selected.value);
            testReadout.textContent = formatCharge(testCharge.value);
            sourceCount.textContent = `${sources.length} total`;
        }

        function configureCamera() {
            const rect = stage.getBoundingClientRect();
            const width = Math.max(1, rect.width);
            const height = Math.max(1, rect.height);
            const aspect = width / height;
            const halfW = d * aspect;
            const compact = width <= 760;
            const panelRatio = compact ? 0 : Math.min(uiPanel.offsetWidth / Math.max(width, 1), 0.36);
            const centerX = compact ? 0 : -halfW * panelRatio;
            const centerY = 0;
            const extraView = compact ? 1.15 : 1.05;
            camera.left = centerX - halfW * extraView;
            camera.right = centerX + halfW * extraView;
            camera.top = centerY + d;
            camera.bottom = centerY - d;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }

        chargeSelect.addEventListener('change', () => {
            selectedIndex = Number(chargeSelect.value);
            syncUI();
            update();
        });

        sourceSlider.addEventListener('input', () => {
            sources[selectedIndex].value = Number(sourceSlider.value);
            syncUI();
            update();
        });

        testSlider.addEventListener('input', () => {
            testCharge.value = Number(testSlider.value);
            syncUI();
            update();
        });

        [chkComponents, chkNet].forEach(input => input.addEventListener('change', update));
        document.getElementById('add-positive').addEventListener('click', () => addSource(3));
        document.getElementById('add-negative').addEventListener('click', () => addSource(-3));
        document.getElementById('remove-source').addEventListener('click', () => removeSource(selectedIndex));
        document.getElementById('reset').addEventListener('click', resetSources);
        document.querySelectorAll('[data-preset]').forEach(button => {
            button.addEventListener('click', () => applyPreset(button.dataset.preset));
        });

        configureCamera();
        resetSources();

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            configureCamera();
            update();
        });
    </script>
<script defer data-offline-bundle src="superposition_geometry.0.offline.js"></script>


</body>

</html>
