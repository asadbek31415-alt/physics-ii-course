<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyclotron Motion Simulation</title>
    
    <!-- Fonts -->
    
    
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <script defer src="../vendor/katex/katex.min.js"></script>
    <script defer src="../vendor/katex/contrib/auto-render.min.js"></script>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "../vendor/three/build/three.module.js",
                "three/addons/": "../vendor/three/examples/jsm/"
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #c9d1d9;
            display: grid;
            grid-template-columns: clamp(250px, 28vw, 330px) minmax(0, 1fr);
        }

        html {
            display: block;
        }

        body {
            display: grid;
        }

        #container {
            position: relative;
            grid-column: 2;
            grid-row: 1;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: relative;
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: auto;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel {
            pointer-events: auto;
            background: rgba(22, 27, 34, 0.9);
            border: 0;
            border-right: 1px solid #30363d;
            border-radius: 0;
            padding: 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            /* Fit content but keep a reasonable min width */
            width: 100%;
            min-width: 0;
            max-width: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            min-height: 100%;
        }

        h2 { 
            margin: 0; 
            font-size: 1rem; 
            color: #58a6ff; 
            font-weight: 600;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
        }
        
        .formula-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            text-align: center;
            font-size: 0.9rem;
            color: #f0f6fc;
        }

        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #8b949e;
        }
        .stat-val { color: #f0f6fc; font-weight: bold; }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 2px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #c9d1d9;
        }
        
        .slider-label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #58a6ff;
            cursor: pointer;
            height: 4px;
            background: #30363d;
            border-radius: 2px;
            appearance: none;
            margin-top: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #58a6ff;
            margin-top: -5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: #30363d;
            border-radius: 2px;
        }

        .hint {
            font-size: 0.7rem;
            color: #e2b93d;
            margin-top: 2px;
            font-style: italic;
        }

        button {
            width: 100%;
            background: #238636;
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover { background: #2ea043; }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            justify-content: flex-start;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 1px solid #30363d;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; color: #8b949e; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        @media (max-width: 700px) {
            body, html {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) auto;
            }

            .ui-overlay {
                grid-column: 1;
                grid-row: 2;
                height: auto;
                max-height: none;
            }

            .panel {
                min-height: 0;
                border-right: 0;
                border-top: 1px solid #30363d;
                padding: 10px;
            }

            #container {
                grid-column: 1;
                grid-row: 1;
            }
        }

    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <div class="panel">
            <h2>Cyclotron Motion</h2>
            
            <div class="formula-box" id="math-formula">
                $$ R = \frac{m v_{\perp}}{q B} $$
            </div>

            <div class="stats-container">
                <div class="stat-row">
                    <span>Radius (R):</span>
                    <span id="val-radius" class="stat-val">--</span>
                </div>
                <div class="stat-row">
                    <span>Period (T):</span>
                    <span id="val-period" class="stat-val">--</span>
                </div>
            </div>

            <div class="slider-container">
                <div class="slider-header">
                    <span class="slider-label">Mag Field <span style="font-family:'Fira Code'">B</span></span>
                    <span id="disp-B" class="stat-val">3.0</span>
                </div>
                <input type="range" id="input-B" min="0.5" max="5.0" step="0.1" value="3.0">
            </div>
            
            <div class="slider-container">
                <div class="slider-header">
                    <span class="slider-label">Velocity <span style="font-family:'Fira Code'">v<sub>&perp;</sub></span></span>
                    <span id="disp-vp" class="stat-val">10.0</span>
                </div>
                <input type="range" id="input-vp" min="1.0" max="15.0" step="0.5" value="10.0">
            </div>

            <div class="slider-container">
                <div class="slider-header">
                    <span class="slider-label">Velocity <span style="font-family:'Fira Code'">v<sub>&parallel;</sub></span></span>
                    <span id="disp-vpar" class="stat-val">3.0</span>
                </div>
                <input type="range" id="input-vpar" min="0.0" max="5.0" step="0.1" value="3.0">
                <div class="hint" id="helix-hint" style="display:none;">* Helix Mode Active</div>
            </div>

            <div class="slider-container">
                <div class="slider-header">
                    <span class="slider-label">Charge <span style="font-family:'Fira Code'">q</span></span>
                    <span id="disp-q" class="stat-val">3.0</span>
                </div>
                <input type="range" id="input-q" min="0.5" max="5.0" step="0.1" value="3.0">
            </div>

            <div class="slider-container">
                <div class="slider-header">
                    <span class="slider-label">Mass <span style="font-family:'Fira Code'">m</span></span>
                    <span id="disp-m" class="stat-val">3.0</span>
                </div>
                <input type="range" id="input-m" min="0.5" max="5.0" step="0.1" value="3.0">
            </div>

            <button onclick="window.resetSim()">Reset Particle</button>

            <div class="legend">
                <div class="legend-item"><div class="dot" style="background: #f1c40f;"></div> Velocity (v)</div>
                <div class="legend-item"><div class="dot" style="background: #ff3333;"></div> Force (F)</div>
                <div class="legend-item"><div class="dot" style="background: #1f6feb;"></div> Field (B)</div>
            </div>
        </div>
    </div>

    <div id="container"></div>

    <script type="text/offline-module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Render Math ---
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError : false
            });
        });

        // --- Configuration ---
        const params = {
            B: 3.0,
            vPerp: 10.0,
            vPara: 3.0,
            m: 3.0,
            q: 3.0
        };

        // --- Scene Setup ---
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);
        scene.fog = new THREE.FogExp2(0x0d1117, 0.02);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(25, 15, 25);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        function resizeRenderer() {
            const rect = container.getBoundingClientRect();
            const width = Math.max(1, Math.floor(rect.width));
            const height = Math.max(1, Math.floor(rect.height));
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 5, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- Helpers ---
        const grid = new THREE.GridHelper(60, 60, 0x30363d, 0x161b22);
        scene.add(grid);

        // --- Objects ---

        // 1. Particle
        const particleGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const particleMat = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa, 
            roughness: 0.2,
            metalness: 0.8
        });
        const particle = new THREE.Mesh(particleGeo, particleMat);
        scene.add(particle);

        // 2. Trail
        const MAX_TRAIL_POINTS = 3000;
        const trailGeometry = new THREE.BufferGeometry();
        const trailPositions = new Float32Array(MAX_TRAIL_POINTS * 3);
        trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.8 });
        const trail = new THREE.Line(trailGeometry, trailMaterial);
        trail.frustumCulled = false;
        scene.add(trail);

        // 3. Magnetic Field Visuals (Arrows)
        const fieldGroup = new THREE.Group();
        scene.add(fieldGroup);

        function createFieldArrows() {
            while(fieldGroup.children.length > 0){ 
                fieldGroup.remove(fieldGroup.children[0]); 
            }

            // Create a sparse grid of arrows
            const range = 25;
            const step = 10; 
            const dir = new THREE.Vector3(0, 1, 0); // B is up
            const length = 5;
            const hex = 0x1f6feb; // Nice blue

            for(let x = -range; x <= range; x += step) {
                for(let z = -range; z <= range; z += step) {
                    // Staggered height for visual interest
                    for(let y = -5; y <= 20; y += 10) {
                        const origin = new THREE.Vector3(x, y, z);
                        const arrowHelper = new THREE.ArrowHelper(dir, origin, length, hex, 1, 0.5);
                        // Make them somewhat transparent by accessing the line material
                        arrowHelper.line.material.transparent = true;
                        arrowHelper.line.material.opacity = 0.3;
                        arrowHelper.cone.material.transparent = true;
                        arrowHelper.cone.material.opacity = 0.6;
                        fieldGroup.add(arrowHelper);
                    }
                }
            }
        }
        createFieldArrows();

        // 4. Vector Arrows (Attached to particle)
        // Velocity (Yellow)
        const vArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 3, 0xf1c40f, 0.8, 0.6);
        // Force (Red)
        const fArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(), 3, 0xff3333, 0.8, 0.6);
        
        scene.add(vArrow);
        scene.add(fArrow);

        // --- Physics State ---
        let trailIdx = 0;
        const pos = new THREE.Vector3(0, 2, 0);
        const vel = new THREE.Vector3(5, 0, 0);
        const B_vec = new THREE.Vector3(0, 1, 0);

        function updateUI() {
            // Physics Calcs
            const R = (params.m * params.vPerp) / (params.q * params.B);
            const T = (2 * Math.PI * params.m) / (params.q * params.B);

            document.getElementById('val-radius').innerText = R.toFixed(2) + " m";
            document.getElementById('val-period').innerText = T.toFixed(2) + " s";
            
            // Slider Labels
            document.getElementById('disp-B').innerText = params.B.toFixed(1);
            document.getElementById('disp-vp').innerText = params.vPerp.toFixed(1);
            document.getElementById('disp-vpar').innerText = params.vPara.toFixed(1);
            document.getElementById('disp-m').innerText = params.m.toFixed(1);
            document.getElementById('disp-q').innerText = params.q.toFixed(1);

            // Hint
            const hint = document.getElementById('helix-hint');
            hint.style.display = params.vPara > 0 ? 'block' : 'none';
        }

        window.resetSim = function() {
            // Reset to origin
            pos.set(0, 2, 0);
            
            // Set velocity based on current params
            // vPerp along X, vPara along Y (B is Y)
            vel.set(params.vPerp, params.vPara, 0);
            
            // Clear trail
            trailIdx = 0;
            trailPositions.fill(0);
            trailGeometry.attributes.position.needsUpdate = true;
            trailGeometry.setDrawRange(0, 0);
            
            updateUI();
        };

        // --- Input Listeners ---
        function setupSlider(id, paramKey) {
            const el = document.getElementById(id);
            el.addEventListener('input', (e) => {
                params[paramKey] = parseFloat(e.target.value);
                // Reset simulation immediately on change
                window.resetSim();
            });
        }

        setupSlider('input-B', 'B');
        setupSlider('input-vp', 'vPerp');
        setupSlider('input-vpar', 'vPara');
        setupSlider('input-m', 'm');
        setupSlider('input-q', 'q');

        // Initial setup
        window.resetSim();

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = 0.015; // Fixed time step

            // 1. Lorentz Force: F = q(v x B)
            B_vec.set(0, params.B, 0);
            const F = new THREE.Vector3();
            F.crossVectors(vel, B_vec).multiplyScalar(params.q);

            // 2. Acceleration: a = F/m
            const acc = F.clone().divideScalar(params.m);

            // 3. Update Velocity
            vel.x += acc.x * dt;
            vel.z += acc.z * dt;
            
            // Correction: Ensure vPerp magnitude stays constant (Energy conservation)
            const currentPerpSpeed = Math.sqrt(vel.x*vel.x + vel.z*vel.z);
            if (currentPerpSpeed > 0.001) {
                const scale = params.vPerp / currentPerpSpeed;
                vel.x *= scale;
                vel.z *= scale;
            }
            
            // vPara is constant
            vel.y = params.vPara;

            // 4. Update Position
            pos.add(vel.clone().multiplyScalar(dt));

            // --- Visuals ---
            particle.position.copy(pos);

            // Camera follow (vertical only)
            const targetY = Math.max(5, pos.y);
            controls.target.y += (targetY - controls.target.y) * 0.1;

            // Velocity Arrow
            vArrow.position.copy(pos);
            vArrow.setDirection(vel.clone().normalize());
            // Scale velocity arrow slightly with speed
            const speed = vel.length();
            vArrow.setLength(2 + speed * 0.2, 1, 0.5);

            // Force Arrow (Dynamic Length)
            const forceMag = F.length(); // Magnitude of Force
            fArrow.position.copy(pos);
            
            if (forceMag > 0.01) {
                fArrow.visible = true;
                fArrow.setDirection(F.clone().normalize());
                
                // VISUAL SCALING:
                // Force can get quite large (q*v*B). 
                // Example Max: 5 * 15 * 5 = 375. Min: 0.5 * 1 * 0.5 = 0.25.
                // We clamp visual length between 1.5 and 10 to keep it viewable.
                const visualLength = Math.min(10, Math.max(1.5, forceMag * 0.08));
                
                fArrow.setLength(visualLength, 1.2, 0.6);
            } else {
                fArrow.visible = false;
            }

            // Trail Update
            if (trailIdx < MAX_TRAIL_POINTS) {
                trailPositions[trailIdx * 3] = pos.x;
                trailPositions[trailIdx * 3 + 1] = pos.y;
                trailPositions[trailIdx * 3 + 2] = pos.z;
                trailIdx++;
            } else {
                // Shift buffer
                for (let i = 0; i < MAX_TRAIL_POINTS - 1; i++) {
                    trailPositions[i*3] = trailPositions[(i+1)*3];
                    trailPositions[i*3+1] = trailPositions[(i+1)*3+1];
                    trailPositions[i*3+2] = trailPositions[(i+1)*3+2];
                }
                trailPositions[(MAX_TRAIL_POINTS-1)*3] = pos.x;
                trailPositions[(MAX_TRAIL_POINTS-1)*3+1] = pos.y;
                trailPositions[(MAX_TRAIL_POINTS-1)*3+2] = pos.z;
            }
            trailGeometry.setDrawRange(0, trailIdx);
            trailGeometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            resizeRenderer();
        });

        resizeRenderer();
        animate();

    </script>
<script defer data-offline-bundle src="ch3_1_lorentz_force_c1.0.offline.js"></script>



</body>
</html>
