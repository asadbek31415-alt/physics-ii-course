<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solenoid Field Visualization</title>
    <script src="../vendor/three-legacy/three.min.js"></script>
    <script src="../vendor/three-legacy/OrbitControls.js"></script>
    <style>
        body { margin: 0; background-color: #0b1016; color: #e0e0e0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #ui-overlay {
            position: absolute; top: 15px; left: 15px;
            background: rgba(22, 33, 46, 0.9);
            padding: 15px; border-radius: 10px; border: 1px solid #2c3e50;
            width: 220px; z-index: 100; pointer-events: auto;
        }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        button {
            padding: 8px; border: 1px solid #3498db; background: rgba(52, 152, 219, 0.1);
            color: #3498db; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
        }
        button.active { background: #3498db; color: white; }

        .label { font-size: 0.8rem; color: #b0c4de; margin-bottom: 5px; }
        .math { font-family: "Times New Roman", serif; font-style: italic; font-size: 1rem; }
    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

<div id="ui-overlay">
    <div class="label">Core Material</div>
    <div class="btn-group">
        <button id="btn-vac" class="active" onclick="setCore('vacuum')">Vacuum (μᵣ = 1)</button>
        <button id="btn-fer" onclick="setCore('ferro')">Iron (μᵣ ≈ 100)</button>
        <button id="btn-dia" onclick="setCore('dia')">Diamagnet (μᵣ < 1)</button>
    </div>
    <hr style="border:0; border-top:1px solid #2c3e50; margin:15px 0;">
    <div id="stats">
        <div class="label" style="color:#fff">Driving Field: <span class="math">H = nI</span></div>
        <div class="label" style="color:#3498db">Total Field: <span class="math">B = μ₀μᵣH</span></div>
    </div>
</div>

<div id="container"></div>

<script>
    let currentCore = 'vacuum';
    const CONFIG = {
        vacuum: { muR: 1, color: 0x1c2734, bScale: 1 },
        ferro:  { muR: 100, color: 0x5d6d7e, bScale: 3 }, // Logarithmic visual scale
        dia:    { muR: 0.8, color: 0x2c3e50, bScale: 0.8 }
    };

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1016);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 4, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dLight.position.set(5, 10, 5);
    scene.add(dLight);

    // --- SOLENOID OBJECTS ---

    // 1. The Core
    const coreGeo = new THREE.CylinderGeometry(0.8, 0.8, 5, 32);
    const coreMat = new THREE.MeshPhongMaterial({ color: CONFIG.vacuum.color });
    const core = new THREE.Mesh(coreGeo, coreMat);
    core.rotation.z = Math.PI / 2;
    scene.add(core);

    // 2. The Coil (Helix)
    const points = [];
    const turns = 15;
    const radius = 1.0;
    const length = 4.8;
    for (let i = 0; i < 200; i++) {
        const t = i / 200;
        const angle = t * Math.PI * 2 * turns;
        const x = (t - 0.5) * length;
        const y = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        points.push(new THREE.Vector3(x, y, z));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, 200, 0.04, 8, false);
    const coilMat = new THREE.MeshPhongMaterial({ color: 0xf1c40f });
    const coil = new THREE.Mesh(tubeGeo, coilMat);
    scene.add(coil);

    // 3. Field Vectors
    // H Vector (Static for fixed I)
    const hArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(-3.5, 1.5, 0), 1.5, 0xaaaaaa, 0.2, 0.1);
    scene.add(hArrow);
    
    // B Vector (Dynamic)
    const bArrows = [];
    const arrowCount = 5;
    for(let i=0; i<arrowCount; i++) {
        const arrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3((i-2)*1.2, 0, 0), 1, 0x3498db, 0.3, 0.15);
        scene.add(arrow);
        bArrows.push(arrow);
    }

    // --- FUNCTIONS ---

    function setCore(type) {
        currentCore = type;
        
        // UI Update
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type.substring(0,3)).classList.add('active');

        // Core visual update
        core.material.color.setHex(CONFIG[type].color);
        
        // Arrow scaling
        const scale = CONFIG[type].bScale;
        bArrows.forEach(arrow => {
            arrow.setLength(scale, 0.3 * Math.min(scale, 1), 0.15 * Math.min(scale, 1));
            // In ferromagnetic mode, make it thicker
            arrow.line.scale.set(1, scale, scale);
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        
        // Subtle coil animation (current flow simulation)
        coil.rotation.x += 0.005;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setCore('vacuum');
    animate();
</script>

</body>
</html>
