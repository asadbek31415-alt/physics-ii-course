<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMF Simulator V4 - Fixed Flow</title>
    

    <!-- KaTeX -->
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <script defer src="../vendor/katex/katex.min.js"></script>
    <script defer src="../vendor/katex/contrib/auto-render.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "../vendor/three/build/three.module.js",
                "three/addons/": "../vendor/three/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            display: grid;
            grid-template-columns: clamp(230px, 28vw, 300px) minmax(0, 1fr);
            width: 100vw;
            height: 100vh;
        }

        #scene-container {
            position: relative;
            grid-column: 2;
            grid-row: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #scene-container canvas,
        #scene-container > div {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Panel */
        #ui-panel {
            position: relative;
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 20, 0.95);
            border: 0;
            border-right: 1px solid #333;
            border-radius: 0;
            color: #eee;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            transition: height 0.3s ease;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* Header (Clickable) */
        .panel-header {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid transparent;
            transition: background 0.2s;
        }

        .panel-header:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 13px;
            margin: 0;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            pointer-events: none;
        }

        .toggle-icon {
            font-size: 12px;
            color: #888;
            transition: transform 0.3s;
        }

        /* Content Body */
        .panel-content {
            padding: 20px;
            opacity: 1;
            transition: opacity 0.3s;
        }

        /* Collapsed State */
        #ui-panel.collapsed .panel-content {
            display: none;
            opacity: 0;
        }

        #ui-panel.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        #ui-panel.collapsed {
            height: auto;
        }

        /* Shrink width when collapsed */

        p {
            font-size: 11px;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .small-note {
            margin: 12px 0 0;
            color: #8b949e;
        }

        .math-display {
            background: #050505;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Controls */
        .control-group {
            margin-bottom: 15px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #ccc;
            margin-bottom: 5px;
        }

        input[type=range] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
        }

        #slider-res::-webkit-slider-thumb {
            background: #9ca3af;
        }

        .stats-row {
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .val-green {
            color: #4ade80;
            font-family: 'Fira Code', monospace;
        }

        /* 3D Labels */
        .battery-label {
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            font-size: 16px;
            color: #fbbf24;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #fbbf24;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
            }

            #ui-panel {
                grid-column: 1;
                grid-row: 1;
                height: auto;
                max-height: none;
                border-right: 0;
                border-bottom: 1px solid #333;
            }

            #scene-container {
                grid-column: 1;
                grid-row: 2;
            }
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>

<body>

    <div id="ui-panel">
        <div class="panel-header" onclick="toggleUI()">
            <h2>Circuit Physics</h2>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="panel-content">
            <p>Observe how EMF drives charges through a resistive material. Scattering inside that material transfers energy to the lattice.</p>

            <div class="math-display" id="math-eq"></div>

            <div class="control-group">
                <div class="label-row">
                    <span>Voltage (EMF)</span>
                </div>
                <input type="range" id="slider-emf" min="1" max="24" value="12" step="1">
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Resistance (Lattice Density)</span>
                    <span id="txt-res">10 Ω</span>
                </div>
                <input type="range" id="slider-res" min="2" max="50" value="10" step="1">
            </div>

            <div class="stats-row">
                <span>Current Flow</span>
                <span id="txt-cur" class="val-green">Loading...</span>
            </div>

            <p class="small-note">Same average current flows before, through, and after the resistor.</p>
        </div>
    </div>

    <div id="scene-container"></div>

    <script type="text/offline-module">
        // The offline launcher grants local module access for the self-contained course.
        function showStartupError(message) {
            document.getElementById('txt-cur').textContent = 'Unavailable';
            const scene = document.getElementById('scene-container');
            const notice = document.createElement('div');
            notice.setAttribute('role', 'alert');
            Object.assign(notice.style, {
                position: 'absolute', inset: '0', display: 'flex',
                alignItems: 'center', justifyContent: 'center', padding: '28px',
                color: '#e2e8f0', font: '14px/1.6 Inter, sans-serif', textAlign: 'center'
            });
            notice.textContent = message;
            scene.appendChild(notice);
        }
        import('./circuit-lessons/emf-loop.js').catch(error => {
            console.error('EMF startup failed:', error);
            showStartupError('The simulator could not start. Launch the course using 01 START PHYSICS II COURSE.vbs, then reload. Details: ' + error.message);
        });
    </script>
<script defer data-offline-bundle src="battery_emf.0.offline.js"></script>



</body>

</html>
