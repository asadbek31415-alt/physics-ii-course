<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteresis Loop</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="../vendor/mathjax/tex-mml-chtml.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Controls */
        .controls {
            width: 80%;
            max-width: 600px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(28, 39, 52, 0.9);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #2c3e50;
            z-index: 10;
        }

        label {
            color: #f1c40f;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            accent-color: #f1c40f;
            cursor: pointer;
        }

        /* Layout */
        .wrapper {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .canvas-container {
            position: relative;
            background: #080c10;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2c3e50;
            padding: 10px;
        }

        .label-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #8899a6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Status Box */
        .status-box {
            margin-top: 10px;
            text-align: center;
            height: 24px;
            color: #3498db;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Domain Grid */
        #domainGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 200px;
            height: 200px;
        }

        .domain-cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #555;
            transition: all 0.2s;
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>

<body>

    <div class="controls">
        <label for="hInput">Applied Field ($H$)</label>
        <input type="range" id="hInput" min="-100" max="100" value="0" step="1" oninput="updateH(this.value)">
        <div
            style="display:flex; justify-content: space-between; width: 100%; font-size: 0.8rem; color: #888; margin-top: 5px;">
            <span>-H (Reverse)</span>
            <span>0</span>
            <span>+H (Forward)</span>
        </div>
    </div>

    <div class="wrapper">

        <!-- Hysteresis Graph -->
        <div class="canvas-container">
            <div class="label-title">B vs H Loop</div>
            <canvas id="graphCanvas" width="400" height="350"></canvas>
            <div id="status" class="status-box"></div>
        </div>

        <!-- Domain Visualizer -->
        <div class="canvas-container" style="width: 220px;">
            <div class="label-title">Magnetic Domains</div>
            <div id="domainGrid">
                <!-- Generated by JS -->
            </div>
            <div style="font-size: 0.8rem; color: #666; text-align: center; margin-top: 15px; padding: 0 10px;">
                Arrows represent atomic alignment in microscopic domains.
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const domainGrid = document.getElementById('domainGrid');

        // Physics State
        let currentH = 0;
        let currentB = 0;
        let isVirginCurve = true; // Tracks if we are on the initial magnetization path
        let pathHistory = []; // To draw the trail

        // Hysteresis Parameters
        const saturationB = 90;
        const coercivity = 40;
        const curveSharpness = 0.04;

        // --- DOMAIN SETUP ---
        const domains = [];
        for (let i = 0; i < 16; i++) {
            const div = document.createElement('div');
            div.className = 'domain-cell';
            div.innerHTML = '↑';
            domainGrid.appendChild(div);
            // Random initial orientation (angle)
            domains.push({ el: div, angle: Math.random() * Math.PI * 2 });
        }

        // --- CORE LOGIC ---

        function updateH(val) {
            const newH = parseFloat(val);
            const dH = newH - currentH;

            // Check if we should leave the virgin curve
            // 1. If we reverse direction (dH has different sign than H, meaning we are moving back towards 0 from a value)
            if (isVirginCurve && Math.abs(newH) < Math.abs(currentH)) {
                isVirginCurve = false;
            }
            // 2. If we reach saturation, we are effectively on the loop
            if (isVirginCurve && Math.abs(currentB) > saturationB * 0.99) {
                isVirginCurve = false;
            }

            // Target B Calculation
            let targetB;

            if (isVirginCurve) {
                // Initial Magnetization Curve (Passes through origin)
                // sigmoid shape between the upper and lower branches
                targetB = saturationB * Math.tanh(curveSharpness * newH);
            } else {
                // Hysteresis Loop Branches
                const targetB_up = saturationB * Math.tanh(curveSharpness * (newH - coercivity));   // Lower branch (going right)
                const targetB_down = saturationB * Math.tanh(curveSharpness * (newH + coercivity)); // Upper branch (going left)

                // Choose branch based on direction
                if (dH > 0) targetB = targetB_up;
                else if (dH < 0) targetB = targetB_down;
                else targetB = currentB; // No change
            }

            // Interpolate to simulate smooth transition
            const approachRate = isVirginCurve ? 0.5 : 0.3; // Tighter lock on virgin curve?

            if (Math.abs(dH) > 0 || isVirginCurve) {
                // If virgin, we want to stick close to the line.
                currentB += (targetB - currentB) * approachRate;
            }

            // Clamping
            if (currentB > saturationB) currentB = saturationB;
            if (currentB < -saturationB) currentB = -saturationB;

            currentH = newH;

            // Record History
            pathHistory.push({ x: currentH, y: currentB });
            if (pathHistory.length > 500) pathHistory.shift();

            updateStatus();
            draw();
            updateDomains();
        }

        function updateStatus() {
            const hZero = Math.abs(currentH) < 5;
            const bZero = Math.abs(currentB) < 5;
            const bSat = Math.abs(currentB) > saturationB * 0.95;

            if (isVirginCurve) {
                statusEl.textContent = "Magnetizing (Initial Curve)";
                statusEl.style.color = "#a0a0a0";
            } else if (hZero && !bZero) {
                statusEl.textContent = "Remanence (Permanent Magnet)";
                statusEl.style.color = "#2ecc71";
            } else if (bZero && !hZero) {
                statusEl.textContent = "Coercivity (Demagnetizing)";
                statusEl.style.color = "#f1c40f";
            } else if (bSat) {
                statusEl.textContent = "Saturation";
                statusEl.style.color = "#e74c3c";
            } else {
                statusEl.textContent = "";
            }
        }

        // --- DRAWING ---

        function drawAxes(cx, cy, w, h) {
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, cy); ctx.lineTo(w, cy); // X Axis
            ctx.moveTo(cx, 0); ctx.lineTo(cx, h); // Y Axis
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#888';
            ctx.font = '12px Inter';
            ctx.fillText('+H', w - 25, cy + 15);
            ctx.fillText('-H', 5, cy + 15);
            ctx.fillText('+B', cx + 10, 15);
            ctx.fillText('-B', cx + 10, h - 5);
        }

        function drawMajorLoop(cx, cy, scaleX, scaleY) {
            // Draw Virgin Curve (faint)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 4]);
            ctx.beginPath();
            for (let h = -100; h <= 100; h += 5) {
                const b = saturationB * Math.tanh(curveSharpness * h);
                const x = cx + h * scaleX;
                const y = cy - b * scaleY;
                if (h === -100) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Draw Full Loop
            ctx.strokeStyle = 'rgba(52, 152, 219, 0.2)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();

            // Ascending (Bottom)
            for (let h = -100; h <= 100; h += 5) {
                const b = saturationB * Math.tanh(curveSharpness * (h - coercivity));
                const x = cx + h * scaleX;
                const y = cy - b * scaleY;
                if (h === -100) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            // Descending (Top)
            for (let h = 100; h >= -100; h -= 5) {
                const b = saturationB * Math.tanh(curveSharpness * (h + coercivity));
                const x = cx + h * scaleX;
                const y = cy - b * scaleY;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // Scale Factors
            const scaleX = (w / 200) * 0.8;
            const scaleY = (h / 200) * 0.8;

            ctx.clearRect(0, 0, w, h);

            drawAxes(cx, cy, w, h);
            drawMajorLoop(cx, cy, scaleX, scaleY);

            // Draw Path History
            if (pathHistory.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 3;

                pathHistory.forEach((pt, i) => {
                    const x = cx + pt.x * scaleX;
                    const y = cy - pt.y * scaleY;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }

            // Draw Current Point
            const px = cx + currentH * scaleX;
            const py = cy - currentB * scaleY;

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f1c40f';
            ctx.stroke();

            // Draw Projection Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px, py); ctx.lineTo(px, cy);
            ctx.moveTo(px, py); ctx.lineTo(cx, py);
            ctx.stroke();
        }

        function updateDomains() {
            // Visualize Domains based on current B
            // If B is saturated positive, all point UP.
            // If B is zero, random.

            const normalizedB = currentB / saturationB; // -1 to 1

            domains.forEach((d) => {
                // Calculate target angle based on B
                // B=1 -> Angle = 0 (Up)
                // B=-1 -> Angle = PI (Down)

                // Add noise. The stronger the field, the less noise.
                const noise = (1 - Math.abs(normalizedB)) * (Math.random() - 0.5) * Math.PI;

                let targetAngle;
                if (normalizedB > 0) targetAngle = 0; // Up
                else targetAngle = Math.PI; // Down

                // Interpolate actual display angle
                // 0 bias means totally random. 1 bias means totally aligned.
                const bias = Math.abs(normalizedB);

                // If bias is low, revert to random "jumbled" state
                let finalAngle;
                if (bias < 0.1) {
                    finalAngle = d.angle; // Keep inherent random angle
                } else {
                    // Smoothly rotate towards field direction
                    finalAngle = targetAngle + noise;
                }

                d.el.style.transform = `rotate(${finalAngle}rad)`;

                // Color intensity
                if (normalizedB > 0) {
                    d.el.style.color = `rgba(52, 152, 219, ${0.3 + bias})`;
                    d.el.style.borderColor = `rgba(52, 152, 219, ${0.2})`;
                } else {
                    d.el.style.color = `rgba(231, 76, 60, ${0.3 + bias})`;
                    d.el.style.borderColor = `rgba(231, 76, 60, ${0.2})`;
                }
            });
        }

        // Init
        updateH(0);

    </script>
</body>

</html>
