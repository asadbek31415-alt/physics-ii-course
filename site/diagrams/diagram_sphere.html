<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Sphere Diagram</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
        }

        #app {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #scene-container {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        #scene-container canvas {
            display: block;
        }

        /* KaTeX sizing */
        .math-label {
            font-size: 1.1rem;
            color: #eee;
            pointer-events: none;
            white-space: nowrap;
        }

        #controls {
            position: relative;
            z-index: 10;
            width: 250px;
            padding: 14px 12px;
            background: rgba(30, 30, 30, 0.94);
            border-right: 1px solid #444;
            overflow-y: auto;
        }

        h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: #69f0ae;
            border-bottom: 1px solid #555;
            padding-bottom: 4px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        input[type=checkbox] {
            margin-right: 8px;
            accent-color: #69f0ae;
            transform: scale(0.9);
        }

        input[type=range] {
            width: 100%;
            accent-color: #69f0ae;
            margin-top: 3px;
        }

        .val-display {
            float: right;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .sub-label {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: -3px;
            margin-bottom: 8px;
            display: block;
        }

        @media (max-width: 680px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
            }

            #controls {
                width: 100%;
                max-height: none;
                border-right: 0;
                border-bottom: 1px solid #444;
            }
        }
    </style>

    <!-- KaTeX -->
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <script defer src="../vendor/katex/katex.min.js"></script>
    <script defer src="../vendor/katex/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            macros: {
                '\\rsep': '{\\text{𝓇}}',
                '\\vecrsep': '{\\vec{\\text{𝓇}}}',
                '\\hatrsep': '{\\hat{\\text{𝓇}}}'
            }
        });">
        </script>

    <script type="importmap">
        { "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
    </script>
<script src="../simulator-layout.js"></script>
</head>

<body>

    <div id="app">
        <div id="controls">
            <h3>Solid Sphere Charge</h3>

            <label>
                Density (&rho;): <span id="val" class="val-display">5.0</span>
            </label>
            <input type="range" id="slider" min="-10" max="10" step="0.1" value="5.0">
            <span class="sub-label">Controls total charge</span>

            <label style="margin-top: 10px;">
                Shell Radius (r'): <span id="rad-val" class="val-display">2.0</span>
            </label>
            <input type="range" id="rad-slider" min="0.1" max="2.9" step="0.1" value="2.0">
            <span class="sub-label">Select integration shell</span>

            <hr style="border-color: #444; margin: 8px 0;">

            <label>
                <input type="checkbox" id="show-field" checked> Show Field
            </label>

            <label>
                <input type="checkbox" id="show-calc"> Show Integration
            </label>

            <label>
                <input type="checkbox" id="show-coords"> Show Coordinates ($\vec{r}, \vec{r}'$)
            </label>
        </div>
        <div id="scene-container"></div>
    </div>

    <script type="text/offline-module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const sceneContainer = document.getElementById('scene-container');
        const camera = new THREE.PerspectiveCamera(45, sceneContainer.clientWidth / sceneContainer.clientHeight, 0.1, 100);
        camera.position.set(0, 5, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(sceneContainer.clientWidth, sceneContainer.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        sceneContainer.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(sceneContainer.clientWidth, sceneContainer.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.inset = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        sceneContainer.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 10);
        scene.add(dirLight);

        // --- GROUPS ---
        const sphereGroup = new THREE.Group();
        const fieldGroup = new THREE.Group();
        const calcGroup = new THREE.Group();
        scene.add(sphereGroup);
        scene.add(fieldGroup);
        scene.add(calcGroup);

        // --- 1. THE SPHERE ---
        const R = 3.0; // Radius
        const sphereGeo = new THREE.SphereGeometry(R, 32, 32);
        const sphereMat = new THREE.MeshPhongMaterial({
            color: 0x69f0ae,
            transparent: true,
            opacity: 0.4,
            depthWrite: false
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphereGroup.add(sphere);

        // --- 1b. COORDINATE SYSTEM (Added to coordGroup below) ---
        const axes = new THREE.AxesHelper(10);
        const originNode = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));

        // --- 2. THE FIELD (ARROWS) ---
        const arrows = [];
        const count = 96;
        for (let i = 0; i < count; i++) {
            const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
            let r;
            if (Math.random() > 0.4) {
                // Outside (R to 2R)
                r = R + 0.5 + Math.random() * 3;
            } else {
                // Inside (0 to R)
                r = 0.5 + Math.random() * (R - 0.5);
            }

            const origin = dir.clone().multiplyScalar(r);
            const arrow = new THREE.ArrowHelper(dir, origin, 1, 0xffffff, 0.2, 0.1);
            arrow.userData = { baseDir: dir, dist: r };
            fieldGroup.add(arrow);
            arrows.push(arrow);
        }

        // --- 3. CALCULATION ELEMENTS (SHELL INTEGRATION) ---
        calcGroup.visible = false;

        // Point P (Outside)
        const pDist = 5;
        const pPos = new THREE.Vector3(pDist, 0, 0);
        const pGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const pMesh = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
        pMesh.position.copy(pPos);
        calcGroup.add(pMesh);

        // The Differential Shell (dtau) - Dynamic
        const shellMat = new THREE.MeshBasicMaterial({
            color: 0xffff00,
            transparent: true,
            opacity: 0.3,
            wireframe: true
        });
        const shell = new THREE.Mesh(new THREE.SphereGeometry(2.0, 32, 32), shellMat);
        calcGroup.add(shell);

        // Geometry Lines
        const lineMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa });

        // Line R (Sphere Radius)
        const rLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, R, 0)]);
        calcGroup.add(new THREE.Line(rLineGeo, lineMat));

        // Line r' (Shell Radius) - Dynamic
        const shellLineGeo = new THREE.BufferGeometry();
        const shellLine = new THREE.Line(shellLineGeo, new THREE.LineBasicMaterial({ color: 0xffff00 }));
        shellLine.rotation.z = Math.PI / 4;
        calcGroup.add(shellLine);

        // Line to P
        const pLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), pPos]);
        calcGroup.add(new THREE.Line(pLineGeo, lineMat));

        // dE Vector at P
        const deArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), pPos, 2, 0x00ffff, 0.4, 0.2);
        deArrow.visible = false;
        calcGroup.add(deArrow);

        // Coordinate Vectors
        const coordGroup = new THREE.Group();
        coordGroup.visible = false;
        scene.add(coordGroup);

        const arrowRPrime = new THREE.ArrowHelper(new THREE.Vector3(1, 1, 0).normalize(), new THREE.Vector3(0, 0, 0), 2, 0xbb86fc, 0.4, 0.2);
        const arrowR = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 5, 0x64b5f6, 0.4, 0.2);
        coordGroup.add(arrowRPrime, arrowR, axes, originNode);

        // --- LABELS (KaTeX) ---
        function createMathLabel(str, pos, color = "white") {
            const div = document.createElement('div');
            div.className = 'math-label';
            div.style.color = color;

            if (window.katex) {
                try {
                    div.innerHTML = katex.renderToString(str, {
                        macros: {
                            '\\rsep': '{\\text{𝓇}}',
                            '\\vecrsep': '{\\vec{\\text{𝓇}}}',
                            '\\hatrsep': '{\\hat{\\text{𝓇}}}'
                        }
                    });
                } catch (e) { div.textContent = str; }
            } else {
                div.textContent = str;
            }

            const label = new CSS2DObject(div);
            label.position.copy(pos);
            return label;
        }

        const lblP = createMathLabel("P", new THREE.Vector3(pDist + 0.5, 0.2, 0), "white");
        const lblR = createMathLabel("R", new THREE.Vector3(0.2, R / 2, 0), "#aaa");
        const lblRh = createMathLabel("r'", new THREE.Vector3(0, 0, 0), "yellow");
        const lblDtau = createMathLabel("d\\tau", new THREE.Vector3(0, 0, 0), "yellow");
        const lblZ = createMathLabel("z", new THREE.Vector3(pDist / 2, -0.6, 0), "#aaa");
        const lblDe = createMathLabel("d\\vec{E}", new THREE.Vector3(0, 0, 0), "#00ffff");
        const lblRsep = createMathLabel("\\rsep", new THREE.Vector3(0, 0, 0), "yellow");

        const lblO = createMathLabel("O", new THREE.Vector3(-0.4, -0.4, 0), "#aaa");
        const lblRVec = createMathLabel("\\vec{r}", new THREE.Vector3(pDist / 2, 0.6, 0), "#64b5f6");
        const lblRPrimeVec = createMathLabel("\\vec{r}'", new THREE.Vector3(0.5, 1.2, 0), "#bb86fc");

        calcGroup.add(lblP, lblR, lblRh, lblDtau, lblZ, lblDe, lblRsep);
        coordGroup.add(lblO, lblRVec, lblRPrimeVec);

        // --- INTERACTION LOGIC ---
        const slider = document.getElementById('slider');
        const radSlider = document.getElementById('rad-slider');
        const valDisplay = document.getElementById('val');
        const radValDisplay = document.getElementById('rad-val');
        const checkField = document.getElementById('show-field');
        const checkCalc = document.getElementById('show-calc');
        const checkCoords = document.getElementById('show-coords');

        function updateScene() {
            const rho = parseFloat(slider.value);
            const rVal = parseFloat(radSlider.value);

            valDisplay.innerText = rho.toFixed(1);
            radValDisplay.innerText = rVal.toFixed(1);

            // 1. Update Sphere Color
            const color = rho > 0 ? 0xff5252 : (rho < 0 ? 0x448aff : 0x888888);
            sphere.material.color.setHex(color);

            // 2. Update Field Arrows
            const mag = Math.abs(rho);
            const sign = Math.sign(rho);

            fieldGroup.visible = checkField.checked;

            arrows.forEach(arrow => {
                const r = arrow.userData.dist;
                let E_mag = 0;
                if (r < R) { E_mag = mag * (r / R); }
                else { E_mag = mag * (R * R) / (r * r); }

                const length = E_mag * 0.42;

                if (length < 0.1 || mag === 0) {
                    arrow.visible = false;
                } else {
                    arrow.visible = true;
                    const dir = arrow.userData.baseDir.clone().multiplyScalar(sign);
                    arrow.setDirection(dir);
                    arrow.setLength(length, length * 0.25, length * 0.15);
                    arrow.setColor(color);
                    arrow.line.material.transparent = true;
                    arrow.line.material.opacity = 0.72;
                    arrow.cone.material.transparent = true;
                    arrow.cone.material.opacity = 0.82;
                }
            });

            // 3. Update Calculation Elements
            if (checkCalc.checked) {
                calcGroup.visible = true;
                sphere.material.opacity = 0.15; // Dim main sphere

                // Update Shell Geometry
                shell.geometry.dispose();
                shell.geometry = new THREE.SphereGeometry(rVal, 32, 32);

                // Update Shell Radius Line
                shellLine.geometry.setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, rVal, 0)]);

                // Update r' arrow
                const rPrimeDir = new THREE.Vector3(0, 1, 0).applyAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 4);
                arrowRPrime.setDirection(rPrimeDir);
                arrowRPrime.setLength(rVal, 0.3, 0.15);
                lblRPrimeVec.position.copy(rPrimeDir).multiplyScalar(rVal / 2).add(new THREE.Vector3(0.4, 0.4, 0));

                // Angle for labels to look nice
                const lx = rVal * Math.sin(Math.PI / 4);
                const ly = rVal * Math.cos(Math.PI / 4);
                lblRh.position.set(-lx, ly, 0);
                lblDtau.position.set(lx, ly, 0);

                // Ensure labels are visible
                [lblP, lblR, lblRh, lblDtau, lblZ, lblDe, lblRsep].forEach(l => l.visible = true);
                [lblO, lblRVec, lblRPrimeVec].forEach(l => l.visible = checkCoords.checked);

                // Update dE Vector (at P, point charge field from shell)
                // dE ~ rho * (volume of shell) / z^2
                // volume ~ rVal^2
                // So dE ~ rho * rVal^2
                const deMag = (mag * rVal * rVal * 0.4); // Visualization scale
                const deDir = new THREE.Vector3(sign || 1, 0, 0); // Along x-axis (since P is on x)

                deArrow.position.copy(pPos);
                deArrow.setDirection(deDir);

                if (deMag > 0.1) {
                    deArrow.visible = true;
                    deArrow.setLength(deMag, deMag * 0.25, deMag * 0.15);
                    lblDe.visible = true;
                    lblDe.position.copy(pPos.clone().add(deDir.clone().multiplyScalar(deMag + 0.5)));

                    // Separation vector label Rsep (between shell and P)
                    const midRsep = new THREE.Vector3(pDist / 2, 0, 0);
                    lblRsep.position.copy(midRsep).add(new THREE.Vector3(0, 0.4, 0));
                    lblRsep.visible = true;
                } else {
                    deArrow.visible = false;
                    lblDe.visible = false;
                    lblRsep.visible = false;
                }

            } else {
                calcGroup.visible = false;
                sphere.material.opacity = 0.4;
                [lblP, lblR, lblRh, lblDtau, lblZ, lblDe, lblRsep].forEach(l => l.visible = false);
            }

            coordGroup.visible = checkCoords.checked;
            [lblO, lblRVec, lblRPrimeVec].forEach(l => l.visible = checkCoords.checked);
        }

        // Event Listeners
        slider.addEventListener('input', updateScene);
        radSlider.addEventListener('input', updateScene);

        checkField.addEventListener('change', updateScene);
        checkCalc.addEventListener('change', updateScene);
        checkCoords.addEventListener('change', updateScene);

        // Window Resize
        function resizeScene() {
            const width = Math.max(sceneContainer.clientWidth, 1);
            const height = Math.max(sceneContainer.clientHeight, 1);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            labelRenderer.setSize(width, height);
        }

        window.addEventListener('resize', resizeScene);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // Init
        resizeScene();
        updateScene();
        animate();

    </script>
<script defer data-offline-bundle src="diagram_sphere.0.offline.js"></script>


</body>

</html>
