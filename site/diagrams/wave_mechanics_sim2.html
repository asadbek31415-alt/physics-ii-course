<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Wave Extension Simulator</title>
    <script src="../vendor/three/build/three.min.js"></script>
    
    
    <!-- KaTeX for beautiful math -->
    <link rel="stylesheet" href="../vendor/katex/katex.min.css">
    <script defer src="../vendor/katex/katex.min.js"></script>
    <script defer src="../vendor/katex/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg: #0b0e14;
            --panel: rgba(22, 27, 34, 0.95);
            --text: #e6edf3;
            --blue: #2f81f7;
            --gold: #d29922;
            --border: #30363d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: grid;
            grid-template-columns: clamp(230px, 28vw, 320px) minmax(0, 1fr);
        }

        html {
            display: block;
        }

        body {
            display: grid;
        }

        /* --- UI PANEL --- */
        #ui-panel {
            position: relative;
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: 100%;
            background: var(--panel);
            border: 0;
            border-right: 1px solid var(--border);
            border-radius: 0;
            padding: 15px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            overflow-y: auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            grid-column: 2;
            grid-row: 1;
        }

        h2 { font-size: 0.9rem; margin: 0 0 12px 0; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; }

        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: 0.2s;
        }

        button.active {
            background: var(--blue);
            border-color: #58a6ff;
            color: white;
        }

        .control-group { margin-bottom: 12px; }
        .label-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.85rem; 
            margin-bottom: 4px; 
            color: #c9d1d9; 
            align-items: center;
        }
        
        input[type=range] { width: 100%; accent-color: var(--blue); cursor: pointer; }

        .math-box {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin: 10px 0;
            font-size: 1rem;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .description {
            font-size: 0.75rem;
            color: #8b949e;
            line-height: 1.4;
            margin: 0;
        }

        /* --- VISIBLE BOTTOM TEXT --- */
        #status-overlay {
            position: relative;
            grid-column: 2;
            grid-row: 1;
            align-self: end;
            justify-self: center;
            margin-bottom: 20px;
            width: auto;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        .status-pill {
            background: rgba(0, 0, 0, 0.6);
            color: #8b949e;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 700px) {
            body, html {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
            }

            #ui-panel {
                grid-column: 1;
                grid-row: 1;
                height: auto;
                max-height: none;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 12px;
            }

            canvas,
            #status-overlay {
                grid-column: 1;
                grid-row: 2;
            }
        }
    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>3D Wave extension</h2>
        
        <div class="mode-toggle">
            <button id="btn-plane" class="active">PLANE WAVE</button>
            <button id="btn-sphere">SPHERICAL</button>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span id="tex-freq"></span> 
                <span style="font-family: monospace; color: var(--blue);" id="val-freq">2.0</span>
            </div>
            <input type="range" id="i-freq" min="0.5" max="5" step="0.1" value="2">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span id="tex-speed"></span> 
                <span style="font-family: monospace; color: var(--blue);" id="val-speed">1.5</span>
            </div>
            <input type="range" id="i-speed" min="0.5" max="4" step="0.1" value="1.5">
        </div>

        <div class="math-box" id="math-formula"></div>

        <p class="description">
            <strong id="desc-title" style="color: var(--text);">Plane Wave:</strong> 
            <span id="desc-text">Spans all space. Amplitude remains constant.</span>
        </p>
    </div>

    <div id="status-overlay">
        <span class="status-pill" id="tex-laplacian"></span>
    </div>

    <script type="text/offline-module">
        // --- INITIALIZE MATH ---
        window.addEventListener('DOMContentLoaded', () => {
            katex.render("\\text{Frequency } (\\omega)", document.getElementById('tex-freq'));
            katex.render("\\text{Wave Speed } (v)", document.getElementById('tex-speed'));
            katex.render("\\nabla^2 f = \\frac{1}{v^2} \\frac{\\partial^2 f}{\\partial t^2}", document.getElementById('tex-laplacian'));
            updateMathUI('plane');
        });

        function updateMathUI(mode) {
            const formula = document.getElementById('math-formula');
            const title = document.getElementById('desc-title');
            const text = document.getElementById('desc-text');
            
            if(mode === 'plane') {
                katex.render("f(\\vec{r},t) = A\\cos(\\vec{k}\\cdot\\vec{r} - \\omega t)", formula);
                title.innerText = "Plane Wave:";
                text.innerText = "Wavefronts are parallel planes. Amplitude does not decay.";
            } else {
                katex.render("f(\\vec{r},t) = \\frac{A}{r}\\cos(kr - \\omega t)", formula);
                title.innerText = "Spherical Wave:";
                text.innerText = "Energy spreads over 4πr². Amplitude decays as 1/r.";
            }
        }

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
        camera.position.set(15, 12, 15);
        camera.lookAt(0, -2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        document.body.appendChild(renderer.domElement);

        function resizeRenderer() {
            const rect = renderer.domElement.getBoundingClientRect();
            const width = Math.max(1, Math.floor(rect.width));
            const height = Math.max(1, Math.floor(rect.height));
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }

        const geometry = new THREE.PlaneGeometry(22, 22, 128, 128);
        geometry.rotateX(-Math.PI / 2);

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uFreq: { value: 2.0 },
                uK: { value: 1.33 },
                uMode: { value: 0.0 }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uFreq;
                uniform float uK;
                uniform float uMode;
                varying float vH;

                void main() {
                    vec3 p = position;
                    float h = 0.0;
                    if (uMode < 0.5) {
                        h = 1.0 * cos(uK * p.x - uFreq * uTime);
                    } else {
                        float r = length(p.xz) + 0.2;
                        h = (2.8 / r) * cos(uK * r - uFreq * uTime);
                        h = clamp(h, -4.0, 4.0);
                    }
                    p.y = h;
                    vH = h;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                }
            `,
            fragmentShader: `
                varying float vH;
                void main() {
                    vec3 c = mix(vec3(0.05, 0.08, 0.15), vec3(0.2, 0.5, 1.0), vH * 0.4 + 0.5);
                    gl_FragColor = vec4(c, 1.0);
                }
            `,
            wireframe: true
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- INTERACTION ---
        const iFreq = document.getElementById('i-freq');
        const iSpeed = document.getElementById('i-speed');
        
        document.getElementById('btn-plane').onclick = (e) => {
            material.uniforms.uMode.value = 0.0;
            e.target.className = 'active';
            document.getElementById('btn-sphere').className = '';
            updateMathUI('plane');
        };

        document.getElementById('btn-sphere').onclick = (e) => {
            material.uniforms.uMode.value = 1.0;
            e.target.className = 'active';
            document.getElementById('btn-plane').className = '';
            updateMathUI('sphere');
        };

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const f = parseFloat(iFreq.value);
            const s = parseFloat(iSpeed.value);
            
            document.getElementById('val-freq').innerText = f.toFixed(1);
            document.getElementById('val-speed').innerText = s.toFixed(1);

            material.uniforms.uTime.value = t;
            material.uniforms.uFreq.value = f;
            material.uniforms.uK.value = f / s;

            mesh.rotation.y = Math.sin(t * 0.1) * 0.03;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            resizeRenderer();
        });
        resizeRenderer();
    </script>
<script defer data-offline-bundle src="wave_mechanics_sim2.0.offline.js"></script>

</body>
</html>
