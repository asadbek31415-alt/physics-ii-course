<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differential Charge Elements</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
        }

        /* UI Controls */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(20, 20, 20, 0.8);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #333;
            max-width: calc(100vw - 24px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .btn:hover {
            color: #fff;
        }

        .btn.active {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid #fff;
        }

        /* Labels */
        .label {
            color: #ffffff;
            font-family: 'Times New Roman', serif;
            font-size: 18px;
            text-shadow: 0 2px 4px #000000;
            pointer-events: none;
            user-select: none;
        }

        .label-dq {
            color: #ffaa00;
            font-weight: bold;
            font-size: 16px;
        }
    </style>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "../vendor/three/build/three.module.js",
                "three/addons/": "../vendor/three/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="controls">
        <button class="btn active" onclick="setMode('line')">Line (λ)</button>
        <button class="btn" onclick="setMode('surface')">Surface (σ)</button>
        <button class="btn" onclick="setMode('volume')">Volume (ρ)</button>
    </div>

    <script type="text/offline-module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(16, 12, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- SHARED OBJECTS ---

        // 1. Point P
        const pGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pointP = new THREE.Mesh(pGeo, pMat);
        pointP.position.set(7, 7, 0);
        scene.add(pointP);

        const pDiv = document.createElement('div');
        pDiv.className = 'label';
        pDiv.innerHTML = 'P';
        const pLabel = new CSS2DObject(pDiv);
        pLabel.position.set(0, 0.5, 0);
        pointP.add(pLabel);

        // 2. The dq Element (Orange Marker) - Geometry changes per mode
        const dqMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        let dqMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), dqMat);
        scene.add(dqMesh);

        const dqDiv = document.createElement('div');
        dqDiv.className = 'label label-dq';
        dqDiv.innerHTML = "dq";
        const dqLabel = new CSS2DObject(dqDiv);
        dqLabel.position.set(0, 0.8, 0);
        dqMesh.add(dqLabel);

        // 3. Vector r (Arrow)
        const arrowHelper = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(0, 0, 0),
            1,
            0xffffff,
            0.5, 0.3
        );
        scene.add(arrowHelper);

        const rDiv = document.createElement('div');
        rDiv.className = 'label';
        rDiv.innerHTML = '<b>r</b>';
        const rLabel = new CSS2DObject(rDiv);
        scene.add(rLabel);

        // --- GROUPS FOR MODES ---
        const groupLine = new THREE.Group();
        const groupSurf = new THREE.Group();
        const groupVol = new THREE.Group();
        scene.add(groupLine);
        scene.add(groupSurf);
        scene.add(groupVol);

        // =========================================
        // 1. LINE MODE (Cyan)
        // =========================================
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-6, -2, 4),
            new THREE.Vector3(-2, 1, -2),
            new THREE.Vector3(3, -2, 2)
        ]);
        const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.08, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5, wireframe: true });
        const lineMesh = new THREE.Mesh(tubeGeo, tubeMat);
        groupLine.add(lineMesh);

        // Label Lambda (Inside group so it hides automatically)
        const lamDiv = document.createElement('div');
        lamDiv.className = 'label';
        const lamLabel = new CSS2DObject(lamDiv);
        lamLabel.position.set(-6, -1, 4);
        groupLine.add(lamLabel);

        // Cylinder Geometry for dq (Along line)
        const dqLineGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 8);
        dqLineGeo.rotateX(Math.PI / 2); // Default cylinder is Y-up, rotate to Z-forward for alignment logic

        // =========================================
        // 2. SURFACE MODE (Blue)
        // =========================================
        const planeGeo = new THREE.PlaneGeometry(12, 12, 40, 40);
        const pos = planeGeo.attributes.position;
        // Create a wavy surface
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            // z = f(x,y)
            const z = Math.sin(x * 0.4) * 1.5 + Math.cos(y * 0.4) * 1.0;
            pos.setZ(i, z);
        }
        planeGeo.computeVertexNormals();

        const surfMat = new THREE.MeshPhongMaterial({
            color: 0x0066ff,
            emissive: 0x001133,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7,
            shininess: 80,
            wireframe: false
        });
        const surfMesh = new THREE.Mesh(planeGeo, surfMat);
        surfMesh.rotation.x = -Math.PI / 2; // Lay flat
        surfMesh.position.y = -2;
        groupSurf.add(surfMesh);

        const wireGeo = new THREE.WireframeGeometry(planeGeo);
        const wireMat = new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.2 });
        const wireMesh = new THREE.LineSegments(wireGeo, wireMat);
        wireMesh.rotation.x = -Math.PI / 2;
        wireMesh.position.y = -2;
        groupSurf.add(wireMesh);

        const sigDiv = document.createElement('div');
        sigDiv.className = 'label';
        const sigLabel = new CSS2DObject(sigDiv);
        sigLabel.position.set(-5, 0, 5);
        groupSurf.add(sigLabel);

        // Flat box for dq surface
        const dqSurfGeo = new THREE.BoxGeometry(0.8, 0.1, 0.8);

        // =========================================
        // 3. VOLUME MODE (Purple)
        // =========================================
        // Create an arbitrary blob using a high-res sphere + noise
        const volGeo = new THREE.SphereGeometry(4, 64, 64);
        const vPos = volGeo.attributes.position;
        const tempVec = new THREE.Vector3();

        for (let i = 0; i < vPos.count; i++) {
            tempVec.set(vPos.getX(i), vPos.getY(i), vPos.getZ(i));
            const len = tempVec.length();
            tempVec.normalize();

            // Smooth noise function
            const distortion = Math.sin(tempVec.x * 3) * 0.5 + Math.cos(tempVec.y * 2.5) * 0.5 + Math.sin(tempVec.z * 3) * 0.5;
            const newLen = len + distortion;

            tempVec.multiplyScalar(newLen);
            vPos.setXYZ(i, tempVec.x, tempVec.y, tempVec.z);
        }
        volGeo.computeVertexNormals();

        const volMat = new THREE.MeshPhongMaterial({
            color: 0x9900ff,
            emissive: 0x220044,
            transparent: true,
            opacity: 0.3,
            shininess: 100,
            side: THREE.DoubleSide
        });
        const volMesh = new THREE.Mesh(volGeo, volMat);
        volMesh.position.set(-1, -1, -1);
        groupVol.add(volMesh);

        // Wireframe for volume
        const volWireGeo = new THREE.WireframeGeometry(volGeo);
        const volWireMat = new THREE.LineBasicMaterial({ color: 0xaa44ff, transparent: true, opacity: 0.1 });
        const volWireMesh = new THREE.LineSegments(volWireGeo, volWireMat);
        volWireMesh.position.set(-1, -1, -1);
        groupVol.add(volWireMesh);

        const rhoDiv = document.createElement('div');
        rhoDiv.className = 'label';
        const rhoLabel = new CSS2DObject(rhoDiv);
        rhoLabel.position.set(0, 4.5, 0);
        groupVol.add(rhoLabel);

        // Cube for dq volume
        const dqVolGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);


        // --- ANIMATION STATE ---
        let mode = 'line';
        let time = 0;

        // Initialize visibility
        groupLine.visible = true;
        groupSurf.visible = false;
        groupVol.visible = false;
        dqMesh.geometry = dqLineGeo;

        function updateVectorAndLabels(origin) {
            // Update Arrow
            const direction = new THREE.Vector3().subVectors(pointP.position, origin);
            const dist = direction.length();
            direction.normalize();

            arrowHelper.position.copy(origin);
            arrowHelper.setDirection(direction);
            arrowHelper.setLength(dist - 0.2, 0.8, 0.4);

            // Update 'r' label position
            const mid = new THREE.Vector3().addVectors(origin, pointP.position).multiplyScalar(0.5);
            mid.y += 0.5;
            rLabel.position.copy(mid);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            time += 0.003;

            let dqPos = new THREE.Vector3();

            if (mode === 'line') {
                const t = (time % 1);
                dqPos = curve.getPointAt(t);

                // Align cylinder ALONG the line
                const tangent = curve.getTangentAt(t);
                // The geometry was rotated to Z-forward. 
                // We point Z axis to tangent.
                dqMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent);
            }
            else if (mode === 'surface') {
                // Lissajous path
                const u = 0.5 + 0.35 * Math.sin(time * 0.7);
                const v = 0.5 + 0.35 * Math.cos(time * 0.5);

                const x = (u - 0.5) * 12;
                const y = (v - 0.5) * 12;

                // Calculate z based on surface function
                const z = Math.sin(x * 0.4) * 1.5 + Math.cos(y * 0.4) * 1.0;

                // Transform to world (Mesh is rotated -90 X, moved -2 Y)
                // Local (x, y, z) -> World (x, z-2, -y)
                dqPos.set(x, z - 2, -y);

                // Calculate Normal for orientation
                // dz/dx = 0.4*1.5*cos(x*0.4) = 0.6*cos(x*0.4)
                // dz/dy = -0.4*1.0*sin(y*0.4) = -0.4*sin(y*0.4)
                // Normal vector (-dz/dx, -dz/dy, 1) normalized
                const dzdx = 0.6 * Math.cos(x * 0.4);
                const dzdy = -0.4 * Math.sin(y * 0.4);

                // Local normal
                const localNormal = new THREE.Vector3(-dzdx, -dzdy, 1).normalize();

                // Transform normal to world space (Rotate -90 X)
                // (x, y, z) -> (x, z, -y)
                const worldNormal = new THREE.Vector3(localNormal.x, localNormal.z, -localNormal.y);

                dqMesh.position.copy(dqPos);
                dqMesh.lookAt(dqPos.clone().add(worldNormal));
                // Box geometry is Y-up, lookAt aligns Z, need to rotate to align Y with normal
                dqMesh.rotateX(Math.PI / 2);
            }
            else if (mode === 'volume') {
                // Path inside volume
                const x = Math.sin(time) * 2 - 1;
                const y = Math.cos(time * 0.8) * 2 - 1;
                const z = Math.sin(time * 0.4) * 2 - 1;
                dqPos.set(x, y, z);

                dqMesh.rotation.set(time, time, 0);
            }

            dqMesh.position.copy(dqPos);
            updateVectorAndLabels(dqPos);

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // --- EXPOSE FUNCTION TO HTML ---
        window.setMode = function (m) {
            mode = m;
            groupLine.visible = (m === 'line');
            groupSurf.visible = (m === 'surface');
            groupVol.visible = (m === 'volume');

            // Update Labels text
            if (m === 'line') {
                dqDiv.innerHTML = "dq = λ dl'";
                dqMesh.geometry = dqLineGeo;
            }
            if (m === 'surface') {
                dqDiv.innerHTML = "dq = σ da'";
                dqMesh.geometry = dqSurfGeo;
            }
            if (m === 'volume') {
                dqDiv.innerHTML = "dq = ρ dτ'";
                dqMesh.geometry = dqVolGeo;
            }

            // Update Buttons
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            const index = m === 'line' ? 0 : m === 'surface' ? 1 : 2;
            document.querySelectorAll('.btn')[index].classList.add('active');
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
<script defer data-offline-bundle src="charge_densities_dark.0.offline.js"></script>

</body>

</html>
