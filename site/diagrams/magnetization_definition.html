<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetization Definition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }
        canvas { display: block; cursor: move; }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            pointer-events: none;
            z-index: 10;
        }

        .controls {
            background: rgba(15, 23, 42, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            pointer-events: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        h2 { margin: 0 0 5px 0; font-size: 1rem; color: #e0e0e0; text-transform: uppercase; }
        p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }

        .math-display {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #d8b4fe; /* Light Purple */
            font-size: 1.1rem;
            margin-bottom: 15px;
            border: 1px solid #7e22ce;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        /* 3D Labels */
        .annotation {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: opacity 0.2s;
        }
        
        .label-big { font-size: 1.5rem; color: #d8b4fe; border: 2px solid #d8b4fe; background: rgba(0,0,0,0.8); }
    </style>
    <script src="../vendor/three-legacy/three.min.js"></script>
    <script src="../vendor/three-legacy/OrbitControls.js"></script>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="controls">
            <h2>Magnetization (M)</h2>
            <p><strong>M</strong> is the net dipole moment per unit volume.</p>
            
            <div class="math-display">
                M = <span id="val-m">0.0</span>
            </div>

            <div class="slider-container">
                <div class="slider-labels">
                    <span>Random (M≈0)</span>
                    <span>Aligned (M=Max)</span>
                </div>
                <input type="range" id="alignSlider" min="0" max="100" value="0">
            </div>
        </div>
    </div>

    <div id="label-m" class="annotation" style="color: #facc15;">m (atom)</div>
    <div id="label-big-m" class="annotation label-big">M (Total)</div>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.Fog(0x0f172a, 10, 40);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(14, 10, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // --- THE VOLUME (dtau) ---
        const boxSize = 8;
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxEdges = new THREE.EdgesGeometry(boxGeo);
        const boxLines = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.2 }));
        scene.add(boxLines);

        // --- ATOM CREATION FUNCTION ---
        function createAtom() {
            const group = new THREE.Group();

            // Nucleus
            const nuc = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xe74c3c, emissive: 0x7b241c })
            );
            group.add(nuc);

            // Orbit Ring
            const orbit = new THREE.Mesh(
                new THREE.TorusGeometry(0.8, 0.02, 4, 24),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 })
            );
            orbit.rotation.x = Math.PI / 2;
            group.add(orbit);

            // Electron Pivot & Electron
            const pivot = new THREE.Group();
            const electron = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
            );
            electron.position.set(0.8, 0, 0);
            pivot.add(electron);
            group.add(pivot);
            group.userData.pivot = pivot; // Save for animation

            // Dipole Arrow (m) - Yellow
            // Points DOWN relative to orbit (assuming current convention)
            const arrow = new THREE.ArrowHelper(
                new THREE.Vector3(0, -1, 0),
                new THREE.Vector3(0, 0.4, 0),
                1.5,
                0xfacc15,
                0.4, 0.3
            );
            group.add(arrow);

            return group;
        }

        // --- POPULATE VOLUME ---
        const atoms = [];
        const GRID = 3; 
        const spacing = boxSize / GRID;
        const offset = (boxSize / 2) - (spacing / 2);

        for(let x=0; x<GRID; x++) {
            for(let y=0; y<GRID; y++) {
                for(let z=0; z<GRID; z++) {
                    const atom = createAtom();
                    
                    // Position
                    atom.position.set(
                        x * spacing - offset,
                        y * spacing - offset,
                        z * spacing - offset
                    );

                    // Random Rotation Logic
                    const randomEuler = new THREE.Euler(
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    );
                    
                    atom.userData.randomRot = new THREE.Quaternion().setFromEuler(randomEuler);
                    // Aligned Rotation (Down, matching arrow direction to world Y-down for summation visual)
                    // Actually, let's align them UP in world space for clarity, meaning local arrow (0,-1,0) needs to point World (0,1,0).
                    // This requires a 180 deg rotation on X or Z.
                    const alignedEuler = new THREE.Euler(Math.PI, 0, 0);
                    atom.userData.alignedRot = new THREE.Quaternion().setFromEuler(alignedEuler);
                    
                    // Random Phase for orbit
                    atom.userData.phase = Math.random() * Math.PI * 2;

                    // Set initial state
                    atom.quaternion.copy(atom.userData.randomRot);

                    scene.add(atom);
                    atoms.push(atom);
                }
            }
        }

        // --- MACROSCOPIC MAGNETIZATION VECTOR (M) ---
        const mVectorGroup = new THREE.Group();
        scene.add(mVectorGroup);

        // Fancy Arrow for M
        const shaftGeo = new THREE.CylinderGeometry(0.15, 0.15, 1, 16);
        const matM = new THREE.MeshStandardMaterial({ 
            color: 0xd8b4fe, 
            emissive: 0x7e22ce,
            emissiveIntensity: 1,
            transparent: true,
            opacity: 0.9
        });
        const shaft = new THREE.Mesh(shaftGeo, matM);
        shaft.position.y = 0.5; 
        mVectorGroup.add(shaft);

        const headGeo = new THREE.ConeGeometry(0.4, 0.8, 16);
        const head = new THREE.Mesh(headGeo, matM);
        head.position.y = 1.4;
        mVectorGroup.add(head);

        mVectorGroup.visible = false;


        // --- ANIMATION LOOP ---
        const slider = document.getElementById('alignSlider');
        const valDisplay = document.getElementById('val-m');
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;
            controls.update();

            const alignFactor = parseInt(slider.value) / 100;

            // 1. Update Atoms
            atoms.forEach(atom => {
                // Rotation Interpolation
                atom.quaternion.slerpQuaternions(
                    atom.userData.randomRot, 
                    atom.userData.alignedRot, 
                    alignFactor
                );

                // Electron Orbit Animation
                atom.userData.pivot.rotation.y = time + atom.userData.phase;
            });

            // 2. Update Big Vector M
            // We aligned atoms UP (World Y).
            const magnitude = alignFactor * 7; // Max visual length
            
            if (magnitude > 0.2) {
                mVectorGroup.visible = true;
                
                // Scale arrow
                const scaleY = magnitude / 2; 
                mVectorGroup.scale.set(1 + alignFactor, scaleY, 1 + alignFactor);
                
                // Position: Center bottom
                mVectorGroup.position.y = -4;
                
                // Update Text
                valDisplay.innerText = magnitude.toFixed(1);
                valDisplay.style.color = `rgba(216, 180, 254, ${0.5 + alignFactor/2})`;
            } else {
                mVectorGroup.visible = false;
                valDisplay.innerText = "≈ 0";
                valDisplay.style.color = "#94a3b8";
            }

            updateLabels();
            renderer.render(scene, camera);
        }

        // --- LABELS ---
        const lblm = document.getElementById('label-m');
        const lblM = document.getElementById('label-big-m');

        function updateLabels() {
            // Label for small m (pick a specific atom)
            const atom = atoms[13]; // Center atom
            const mTip = new THREE.Vector3(0, -1.5, 0); // Local tip position
            mTip.applyMatrix4(atom.matrixWorld);
            projectLabel(mTip, lblm);

            // Label for Big M
            if(mVectorGroup.visible) {
                const tipPos = new THREE.Vector3(0, mVectorGroup.scale.y * 1.8 - 4, 0);
                projectLabel(tipPos, lblM);
                lblM.style.opacity = 1;
            } else {
                lblM.style.opacity = 0;
            }
        }

        function projectLabel(vec, element) {
            const v = vec.clone();
            v.project(camera);
            
            // Hide if behind camera
            if(v.z > 1) {
                element.style.opacity = 0;
                return;
            }
            element.style.opacity = 1;

            const x = (v.x * .5 + .5) * window.innerWidth;
            const y = (-(v.y * .5) + .5) * window.innerHeight;
            element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
