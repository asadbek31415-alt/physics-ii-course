<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Molecule Alignment</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            display: grid;
            grid-template-columns: clamp(230px, 28vw, 300px) minmax(0, 1fr);
            grid-template-rows: auto 1fr;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            grid-column: 2;
            grid-row: 1 / span 2;
        }
        
        #ui-layer {
            position: relative;
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            max-width: 500px;
            background: rgba(20, 20, 30, 0.9);
            border: 1px solid #333;
            border-top: 0;
            border-left: 0;
            border-radius: 0;
            padding: 14px;
            color: #eee;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            user-select: none;
            box-sizing: border-box;
            z-index: 3;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .label { font-weight: 600; font-size: 0.9rem; width: 140px; }
        .val { font-family: monospace; color: #3498db; width: 40px; text-align: right; }

        input[type=range] {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #3498db;
        }

        /* Legend overlay */
        #legend {
            position: relative;
            grid-column: 1;
            grid-row: 2;
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid #333;
            border-left: 0;
            border-bottom: 0;
            border-radius: 0;
            padding: 14px;
            color: #ccc;
            font-size: 0.8rem;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 2;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        /* Field Arrow */
        #field-arrow {
            position: relative;
            grid-column: 2;
            grid-row: 1 / span 2;
            align-self: center;
            justify-self: center;
            width: 300px;
            height: 100px;
            pointer-events: none;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }
        .arrow-body {
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            width: 100%;
            position: relative;
        }
        .arrow-head {
            position: absolute;
            right: -2px;
            top: -6px;
            width: 0; 
            height: 0; 
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 15px solid rgba(255, 215, 0, 0.3);
        }
        .field-text {
            position: absolute;
            top: -25px;
            color: rgba(255, 215, 0, 0.6);
            font-weight: bold;
            font-size: 1.2rem;
        }

        @media (max-width: 700px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto minmax(0, 1fr);
            }

            #ui-layer {
                grid-column: 1;
                grid-row: 1;
                max-width: none;
                padding: 10px;
            }

            #legend {
                grid-column: 1;
                grid-row: 2;
                max-height: none;
                overflow-y: auto;
                padding: 10px;
            }

            canvas,
            #field-arrow {
                grid-column: 1;
                grid-row: 3;
            }

            .control-row {
                gap: 8px;
            }

            .label {
                width: 116px;
                font-size: 0.78rem;
            }
        }

    </style>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "../vendor/three/build/three.module.js"
            }
        }
    </script>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="field-arrow">
        <div class="field-text">E-Field</div>
        <div class="arrow-body"><div class="arrow-head"></div></div>
    </div>

    <div id="legend">
        <div class="legend-item">
            <span style="color: #f1c40f; font-weight: bold;">&rarr;</span> 
            <span>Electric Field Direction</span>
        </div>
        <div class="legend-item">
            <div class="dot" style="background: #e74c3c"></div>
            <span>Positive End</span>
        </div>
        <div class="legend-item">
            <div class="dot" style="background: #3498db"></div>
            <span>Negative End</span>
        </div>
    </div>

    <div id="ui-layer">
        <div class="control-row">
            <span class="label">Electric Field (E)</span>
            <input type="range" id="slider-e" min="0" max="10" step="0.1" value="0">
            <span class="val" id="val-e">0.0</span>
        </div>
        <div class="control-row">
            <span class="label">Temperature (T)</span>
            <input type="range" id="slider-t" min="0" max="10" step="0.1" value="2.0">
            <span class="val" id="val-t">2.0</span>
        </div>
        <div style="border-top: 1px solid #444; margin: 10px 0;"></div>
        <div class="control-row">
            <span class="label" style="color:#aaa">Net Polarization</span>
            <div style="flex-grow:1; height:6px; background:#333; border-radius:3px; overflow:hidden;">
                <div id="bar-p" style="width:0%; height:100%; background:#3498db; transition: width 0.2s;"></div>
            </div>
            <span class="val" id="val-p" style="width:50px">0%</span>
        </div>
    </div>

    <script type="text/offline-module">
        import * as THREE from 'three';

        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.Fog(0x050505, 5, 25);

        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        document.body.appendChild(renderer.domElement);

        function resizeRenderer() {
            const rect = renderer.domElement.getBoundingClientRect();
            const width = Math.max(1, Math.floor(rect.width));
            const height = Math.max(1, Math.floor(rect.height));
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const redLight = new THREE.PointLight(0xff0000, 0.5, 20);
        redLight.position.set(-10, 0, 0);
        scene.add(redLight);
        const blueLight = new THREE.PointLight(0x0000ff, 0.5, 20);
        blueLight.position.set(10, 0, 0);
        scene.add(blueLight);

        // --- Molecules ---
        const molecules = [];
        const numMolecules = 150;
        
        // Geometry re-use
        const sphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const cylGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
        const redMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4, metalness: 0.1 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.4, metalness: 0.1 });
        const stickMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });

        // Physics State
        let E_field = 0;
        let Temperature = 2.0;

        class Molecule {
            constructor() {
                this.group = new THREE.Group();

                // Stick
                const stick = new THREE.Mesh(cylGeo, stickMat);
                stick.rotation.z = Math.PI / 2; // Lay flat along X
                this.group.add(stick);

                // Positive Atom (Red) - Originally at X = +0.5
                const posAtom = new THREE.Mesh(sphereGeo, redMat);
                posAtom.position.x = 0.5;
                this.group.add(posAtom);

                // Negative Atom (Blue) - Originally at X = -0.5
                const negAtom = new THREE.Mesh(sphereGeo, blueMat);
                negAtom.position.x = -0.5;
                this.group.add(negAtom);

                // Random Position
                this.group.position.x = (Math.random() - 0.5) * 18;
                this.group.position.y = (Math.random() - 0.5) * 10;
                this.group.position.z = (Math.random() - 0.5) * 10;

                // Initial Random Rotation
                this.group.rotation.x = Math.random() * Math.PI * 2;
                this.group.rotation.y = Math.random() * Math.PI * 2;
                this.group.rotation.z = Math.random() * Math.PI * 2;

                // Random rotation axis for thermal jitter
                this.jitterAxis = new THREE.Vector3(
                    Math.random()-0.5, Math.random()-0.5, Math.random()-0.5
                ).normalize();

                scene.add(this.group);
            }

            update() {
                // 1. Thermal Jitter (Random Rotation)
                // Chaos increases with Temperature
                const chaos = Temperature * 0.05;
                this.group.rotateOnWorldAxis(this.jitterAxis, (Math.random() - 0.5) * chaos);
                
                // Change jitter axis slowly
                if(Math.random() < 0.05) {
                    this.jitterAxis.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
                }

                // 2. Electric Torque (Alignment)
                // Field points Right (+X).
                // Dipole wants to align +X.
                if (E_field > 0.1) {
                    // Current forward vector of the molecule (local X axis in world space)
                    const currentDir = new THREE.Vector3(1, 0, 0);
                    currentDir.applyQuaternion(this.group.quaternion);

                    // Target vector is (1, 0, 0)
                    const targetDir = new THREE.Vector3(1, 0, 0);

                    // Calculate quaternion to rotate from current to target
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(currentDir, targetDir);
                    
                    // Slerp (Spherical Linear Interpolation) towards target
                    // Speed depends on E-Field strength
                    const alignSpeed = Math.min(E_field * 0.02, 0.1); 
                    this.group.quaternion.slerp(this.group.quaternion.clone().multiply(quaternion), alignSpeed);
                }
            }
            
            getAlignment() {
                // Returns cosine of angle with X axis (1 = aligned, -1 = anti-aligned, 0 = random)
                const currentDir = new THREE.Vector3(1, 0, 0);
                currentDir.applyQuaternion(this.group.quaternion);
                return currentDir.x;
            }
        }

        // Init
        for(let i=0; i<numMolecules; i++) {
            molecules.push(new Molecule());
        }

        // --- UI Logic ---
        const sliderE = document.getElementById('slider-e');
        const sliderT = document.getElementById('slider-t');
        const valE = document.getElementById('val-e');
        const valT = document.getElementById('val-t');
        const barP = document.getElementById('bar-p');
        const valP = document.getElementById('val-p');
        const arrow = document.getElementById('field-arrow');

        function updateParams() {
            E_field = parseFloat(sliderE.value);
            Temperature = parseFloat(sliderT.value);
            
            valE.innerText = E_field.toFixed(1);
            valT.innerText = Temperature.toFixed(1);

            // Show/Hide Field Arrow
            arrow.style.opacity = E_field > 0.5 ? 1 : 0;
        }

        sliderE.addEventListener('input', updateParams);
        sliderT.addEventListener('input', updateParams);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            let totalAlignment = 0;

            molecules.forEach(m => {
                m.update();
                totalAlignment += m.getAlignment();
            });

            // Calculate Net Polarization %
            // If perfectly random, sum is approx 0. If perfectly aligned, sum is numMolecules.
            // We clamp 0-100%
            let avgAlign = totalAlignment / numMolecules;
            // Normalize slightly for visual effect (thermal motion makes 100% impossible usually)
            let percent = Math.max(0, avgAlign * 100);
            
            barP.style.width = percent + "%";
            valP.innerText = Math.round(percent) + "%";

            renderer.render(scene, camera);
        }

        animate();
        updateParams();

        // Handle Resize
        window.addEventListener('resize', () => {
            resizeRenderer();
        });
        resizeRenderer();

    </script>
<script defer data-offline-bundle src="polar_molecule_alignment.0.offline.js"></script>


</body>
</html>
