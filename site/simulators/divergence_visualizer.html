<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divergence Explorer</title>
    
    <style>
        body { margin: 0; background-color: #101923; overflow: hidden; font-family: 'Inter', sans-serif; color: #eee; }
        
        #canvas-container { position: relative; min-width: 0; min-height: 0; background: #000; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            gap: 9px;
            background: #111923;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #2d455d;
            box-sizing: border-box;
            align-items: stretch;
        }
        #ui-container h2 { color: #31aaff; font-size: 1.2rem; margin: 0 0 4px; }
        #ui-container p { color: #bbcee0; font-size: .88rem; line-height: 1.4; margin: 0; }

        button {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        button:hover { background: #333; color: #fff; }
        button.active { background: #3498db; color: #fff; border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.4); }

        /* Toggle Switch */
        .toggle-container { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #364557; }
        .toggle-label { font-size: 0.85rem; color: #aaa; margin-right: 8px; }
        input[type="checkbox"] { accent-color: #3498db; cursor: pointer; transform: scale(1.2); }

        /* Readout Box */
        #readout {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid #888;
            padding: 12px;
            border-radius: 7px;
            min-width: 0;
        }
        #conclusion { background: #09121d; border: 1px solid #34536e; padding: 11px; border-radius: 7px; }
        #conclusion strong { display: block; color: #fff; margin-bottom: 5px; }
        
        .readout-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .readout-val { font-size: 1.45rem; font-weight: 700; font-family: 'Courier New', monospace; }
        .readout-desc { font-size: 0.95rem; margin-top: 8px; line-height: 1.4; color: #ddd; }
        
        .highlight { font-weight: bold; }
        .pos { color: #ff5252; }
        .neg { color: #448aff; }
        .neu { color: #fff; }

        @media (max-width: 760px) {
            #readout {
                position: fixed;
                top: 8px;
                right: 8px;
                z-index: 20;
                width: 150px;
                padding: 8px;
                background: rgba(7, 14, 23, 0.9);
                pointer-events: none;
            }
            .readout-title { font-size: .67rem; }
            .readout-val { font-size: 1.1rem; }
            .readout-desc { font-size: .72rem; line-height: 1.25; }
        }

    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="ui-container">
        <div><h2>Divergence Explorer</h2><p>Move the cursor across the field to see where it spreads out or gathers in.</p></div>
        <button onclick="setScene(0)" class="active" id="btn0">1. Sources & Sinks</button>
        <button onclick="setScene(1)" id="btn1">2. Variable Expansion</button>
        <button onclick="setScene(2)" id="btn2">3. Sinusoidal</button>
        <button onclick="setScene(3)" id="btn3">4. Pure Rotation</button>
        
        <div id="conclusion"><strong>What this shows</strong><p id="conclusion-text">A source has positive divergence; a sink has negative divergence. Away from them, the field mostly passes through.</p></div>
        <div id="readout">
            <div class="readout-title">Divergence (∇ · F)</div>
            <div id="div-val" class="readout-val neu">—</div>
            <div id="div-desc" class="readout-desc">Move the cursor over the field to probe it.</div>
        </div>
        <label class="toggle-container">
            <span class="toggle-label">Show moving tracers</span>
            <input type="checkbox" id="fluidToggle" checked>
        </label>
    </div>

    <div id="canvas-container"><canvas id="simCanvas" aria-label="Interactive vector field"></canvas></div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const stage = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        
        // --- CONFIGURATION ---
        let width, height, cx, cy;
        let SCALE = 50; // Pixels per unit; narrowed for small screens on resize.
        const PARTICLE_COUNT = 650;
        const ARROW_SPACING = 38;
        const PROBE_RADIUS = 15;

        // --- STATE ---
        let mouse = { x: 0, y: 0, active: false };
        let currentScene = 0;
        let showFluid = true;
        
        // Particles
        const particles = [];
        for(let i=0; i<PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * 1000,
                y: Math.random() * 700,
                age: Math.random() * 100
            });
        }

        // --- SCENES (Field Definitions) ---
        // Returns vector {x, y} for a given position (u, v) in math coordinates
        // Also returns exact divergence if possible, or we calculate numerically
        const scenes = [
            // 0: Sources and Sinks
            {
                field: (x, y) => {
                    const s1 = {x: -3, y: 0, q: 1.0};
                    const s2 = {x: 3, y: 0, q: -1.0};
                    let fx = 0, fy = 0;
                    
                    // Source 1
                    let dx = x - s1.x; let dy = y - s1.y;
                    let r2 = dx*dx + dy*dy;
                    let mag = s1.q / (r2 + 0.1); 
                    fx += dx * mag; fy += dy * mag;

                    // Source 2
                    dx = x - s2.x; dy = y - s2.y;
                    r2 = dx*dx + dy*dy;
                    mag = s2.q / (r2 + 0.1);
                    fx += dx * mag; fy += dy * mag;
                    return {x: fx, y: fy};
                },
                // Analytical Divergence for point charge is delta function, hard to show.
                // We will use numerical differentiation for general case.
            },
            // 1. Variable Expansion (F = <x^2/4, 0>)
            // Div = x/2
            {
                field: (x, y) => { return { x: (x * Math.abs(x)) * 0.05, y: 0 }; }
            },
            // 2. Sinusoidal (F = <sin(x), sin(y)>)
            // Div = cos(x) + cos(y)
            {
                field: (x, y) => { return { x: Math.sin(y+x), y: Math.cos(x-y) }; }
            },
            // 3. Pure Rotation (F = <-y, x>)
            // Div = 0
            {
                field: (x, y) => { return { x: -y * 0.2, y: x * 0.2 }; }
            }
        ];

        function getField(screenX, screenY) {
            const u = (screenX - cx) / SCALE;
            const v = -(screenY - cy) / SCALE; // Y is flipped
            const vec = scenes[currentScene].field(u, v);
            // Return screen vector (y flipped back)
            return { x: vec.x, y: -vec.y, mathX: vec.x, mathY: vec.y };
        }

        // Calculate Divergence Numerically: dFx/dx + dFy/dy
        function getDivergence(screenX, screenY) {
            const h = 1.0; // Step size in pixels
            
            // Sample field around point
            const fRight = getField(screenX + h, screenY);
            const fLeft  = getField(screenX - h, screenY);
            const fUp    = getField(screenX, screenY - h); // Screen Y- is Math Y+
            const fDown  = getField(screenX, screenY + h);

            // dFx/dx
            const dFx_dx = (fRight.mathX - fLeft.mathX) / (2 * h / SCALE);
            
            // dFy/dy (Note: screen Y is inverted, so we must be careful)
            // Math Y increases as Screen Y decreases (Up)
            // dFy = fUp.mathY - fDown.mathY
            // dy  = (2 * h / SCALE)
            const dFy_dy = (fUp.mathY - fDown.mathY) / (2 * h / SCALE);

            return dFx_dx + dFy_dy;
        }

        // --- RENDERING ---

        function drawArrow(x, y, vx, vy, color, alpha) {
            const len = Math.sqrt(vx*vx + vy*vy);
            if(len < 0.01) return;
            
            const scale = Math.min(30, len * 20); 
            const nx = (vx / len) * scale;
            const ny = (vy / len) * scale;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = alpha;
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + nx, y + ny);
            ctx.stroke();

            const angle = Math.atan2(ny, nx);
            const headLen = 5;
            ctx.beginPath();
            ctx.moveTo(x + nx, y + ny);
            ctx.lineTo(x + nx - headLen * Math.cos(angle - Math.PI/6), y + ny - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(x + nx - headLen * Math.cos(angle + Math.PI/6), y + ny - headLen * Math.sin(angle + Math.PI/6));
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        function drawProbe() {
            if (!mouse.active) return;
            // 1. Draw Circle
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, PROBE_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 2. Get Divergence at center
            const div = getDivergence(mouse.x, mouse.y);

            // 3. Update UI
            updateReadout(div);
            
            // 4. Color probe
            ctx.fillStyle = div > 0.01 ? "rgba(255, 82, 82, 0.3)" : (div < -0.01 ? "rgba(68, 138, 255, 0.3)" : "rgba(255, 255, 255, 0.1)");
            ctx.fill();
        }

        function updateReadout(div) {
            const valEl = document.getElementById('div-val');
            const descEl = document.getElementById('div-desc');
            const box = document.getElementById('readout');

            if (div > 0.01) {
                valEl.innerText = "+" + div.toFixed(2);
                valEl.className = "readout-val pos";
                box.style.borderLeftColor = "#ff5252";
                descEl.innerHTML = "<span class='pos highlight'>Positive Divergence</span><br>Source: Field is generated here.";
            } else if (div < -0.01) {
                valEl.innerText = div.toFixed(2);
                valEl.className = "readout-val neg";
                box.style.borderLeftColor = "#448aff";
                descEl.innerHTML = "<span class='neg highlight'>Negative Divergence</span><br>Sink: Field terminates here.";
            } else {
                valEl.innerText = "0.00";
                valEl.className = "readout-val neu";
                box.style.borderLeftColor = "#fff";
                descEl.innerHTML = "<span class='neu highlight'>(Almost) Zero Divergence</span><br>The field passes through without local spreading.";
            }
        }

        function resetReadout() {
            document.getElementById('div-val').textContent = '—';
            document.getElementById('div-val').className = 'readout-val neu';
            document.getElementById('div-desc').textContent = 'Move the cursor over the field to probe it.';
            document.getElementById('readout').style.borderLeftColor = '#888';
        }

        function loop() {
            // Clear
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; 
            ctx.fillRect(0, 0, width, height);

            // 1. Draw Background Vector Grid
            for (let x = 0; x < width; x += ARROW_SPACING) {
                for (let y = 0; y < height; y += ARROW_SPACING) {
                    const f = getField(x, y);
                    const mag = Math.sqrt(f.x*f.x + f.y*f.y);
                    const color = `hsl(${180 + mag*50}, 70%, 50%)`; 
                    drawArrow(x, y, f.x, f.y, color, 0.3);
                }
            }

            if (currentScene === 0) {
                for (const marker of [
                    { x: cx - 3 * SCALE, color: '#ff5252', symbol: '+' },
                    { x: cx + 3 * SCALE, color: '#448aff', symbol: '−' }
                ]) {
                    ctx.beginPath();
                    ctx.arc(marker.x, cy, 11, 0, Math.PI * 2);
                    ctx.fillStyle = marker.color;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(marker.symbol, marker.x, cy);
                }
            }

            // 2. Draw Particles (if enabled)
            if (showFluid) {
                ctx.fillStyle = "#fff";
                for(let p of particles) {
                    const f = getField(p.x, p.y);
                    p.x += f.x * 3; 
                    p.y += f.y * 3;
                    p.age++;

                    if (p.x < 0 || p.x > width || p.y < 0 || p.y > height || p.age > 100) {
                        p.x = Math.random() * width;
                        p.y = Math.random() * height;
                        p.age = 0;
                    }

                    const alpha = 1 - (p.age / 100);
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(p.x, p.y, 2, 2);
                }
                ctx.globalAlpha = 1.0;
            }

            // 3. Draw Probe
            drawProbe();

            requestAnimationFrame(loop);
        }

        // --- EVENTS ---
        window.addEventListener('resize', resize);
        new ResizeObserver(resize).observe(stage);
        canvas.addEventListener('pointermove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });
        canvas.addEventListener('pointerleave', () => { mouse.active = false; resetReadout(); });

        document.getElementById('fluidToggle').addEventListener('change', (e) => {
            showFluid = e.target.checked;
        });

        function resize() {
            const rect = stage.getBoundingClientRect();
            width = Math.max(1, rect.width);
            height = Math.max(1, rect.height);
            SCALE = Math.min(50, width / 8);
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = width / 2;
            cy = height / 2;
            for (const particle of particles) {
                particle.x = Math.random() * width;
                particle.y = Math.random() * height;
            }
        }

        window.setScene = function(idx) {
            currentScene = idx;
            const conclusions = [
                'A source has positive divergence; a sink has negative divergence. Away from them, the field mostly passes through.',
                'The field spreads out on both sides, so divergence is positive except on the center line.',
                'Alternating patches of positive and negative divergence show where the wave field locally spreads or gathers.',
                'The field circulates, but its divergence is zero: rotation alone does not create a source or sink.'
            ];
            document.getElementById('conclusion-text').textContent = conclusions[idx];
            if (mouse.active) updateReadout(getDivergence(mouse.x, mouse.y));
            else resetReadout();
            for(let i=0; i<4; i++) {
                document.getElementById(`btn${i}`).className = (i===idx) ? 'active' : '';
            }
            ctx.clearRect(0, 0, width, height);
        }

        // Init
        resize();
        mouse.x = cx;
        mouse.y = cy;
        loop();

    </script>
</body>
</html>
