<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curl Explorer</title>
    
    <!-- MathJax (Static only) -->
    <script>
        MathJax = { 
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } 
        };
    </script>
    <script id="MathJax-script" async src="../vendor/mathjax/tex-mml-chtml.js"></script>

    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: #eee; }
        
        canvas { display: block; }

        /* UI Overlay */
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(20, 20, 20, 0.9);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 90%;
            max-width: 800px;
        }

        button {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        button:hover { background: #333; color: #fff; }
        button.active { background: #3498db; color: #fff; border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.4); }

        /* Toggle Switch */
        .toggle-container { display: flex; align-items: center; margin-left: 10px; border-left: 1px solid #555; padding-left: 15px; }
        .toggle-label { font-size: 0.85rem; color: #aaa; margin-right: 8px; }
        input[type="checkbox"] { accent-color: #3498db; cursor: pointer; transform: scale(1.2); }

        /* Readout Box */
        #readout {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-left: 4px solid #888;
            padding: 15px;
            border-radius: 4px;
            pointer-events: none;
            width: 320px;
        }
        
        .readout-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        
        .readout-val-container { font-size: 2rem; font-weight: 700; font-family: 'Courier New', monospace; display: flex; align-items: baseline; gap: 10px; }
        
        .readout-desc { font-size: 0.95rem; margin-top: 8px; line-height: 1.4; color: #ddd; }
        
        .highlight { font-weight: bold; }
        .pos { color: #69f0ae; } /* Green for CCW */
        .neg { color: #ff5252; } /* Red for CW */
        .neu { color: #fff; }
        
        /* Icons for text */
        .icon-out::before { content: "⊙"; font-size: 1.2em; vertical-align: middle; margin-right: 4px; }
        .icon-in::before { content: "⊗"; font-size: 1.2em; vertical-align: middle; margin-right: 4px; }

        /* Match the divergence explorer's panel and stage. */
        * { box-sizing: border-box; }
        body { background: #101923; }
        #canvas-container { position: relative; min-width: 0; min-height: 0; background: #000; }
        #simCanvas { width: 100%; height: 100%; cursor: crosshair; }
        #ui-container {
            position: absolute; top: 0; left: 0; bottom: auto; transform: none;
            width: auto; max-width: none; padding: 16px; gap: 9px;
            flex-direction: column; flex-wrap: nowrap; align-items: stretch;
            background: #111923; border-color: #2d455d;
        }
        #ui-container h2 { margin: 0 0 4px; color: #31aaff; font-size: 1.2rem; }
        #ui-container p { margin: 0; color: #bbcee0; font-size: .88rem; line-height: 1.4; }
        #ui-container button { text-align: left; white-space: normal; }
        #conclusion, #readout { min-width: 0; padding: 11px; border-radius: 7px; background: #09121d; }
        #conclusion { border: 1px solid #34536e; }
        #conclusion strong { display: block; margin-bottom: 5px; }
        #readout { position: static; width: auto; pointer-events: auto; border-left: 4px solid #888; }
        .readout-val-container { font-size: 1.45rem; }
        .readout-desc { font-size: .82rem; line-height: 1.3; }
        #circulation-value { margin-top: 5px; color: #bdd0e4; font-size: .82rem; }
        .toggle-container { margin: 0; padding: 8px 0 0; border-left: 0; border-top: 1px solid #364557; }
        @media (max-width: 760px) {
            #readout {
                position: fixed; top: 8px; right: 8px; z-index: 20;
                width: 155px; padding: 8px; background: rgba(7,14,23,.92);
                pointer-events: none;
            }
            .readout-title { font-size: .67rem; }
            .readout-val-container { font-size: 1.1rem; }
            .readout-desc, #circulation-value { font-size: .7rem; }
        }

    </style>
<script src="../simulator-layout.js"></script>
</head>
<body>

    <div id="ui-container">
        <div><h2>Curl Explorer</h2><p>Move the cursor to place a rectangular circulation loop in the field.</p></div>
        <button onclick="setScene(0)" class="active" id="btn0">1. Solid Rotation</button>
        <button onclick="setScene(1)" id="btn1">2. Shear Flow</button>
        <button onclick="setScene(2)" id="btn2">3. Variable Shear</button>
        <button onclick="setScene(3)" id="btn3">4. Irrotational Vortex</button>
        <button onclick="setScene(4)" id="btn4">5. Expansion (Div)</button>
        <button onclick="setScene(5)" id="btn5">6. Sinusoidal</button>
        
        <div id="conclusion"><strong>What this shows</strong><p id="conclusion-text">A rotating field has positive curl. Circulation around a counterclockwise rectangle is positive.</p></div>
        <div id="readout" aria-live="polite">
            <div class="readout-title">Curl (∇ × F) · ẑ</div>
            <div class="readout-val-container"><span id="val-num" class="neu">—</span></div>
            <div id="circulation-value">∮ F · dℓ: —</div>
            <div id="curl-desc" class="readout-desc">Move the cursor over the field to probe it.</div>
        </div>
        <label class="toggle-container">
            <span class="toggle-label">Show moving tracers</span>
            <input type="checkbox" id="fluidToggle" checked>
        </label>
    </div>

    <div id="canvas-container"><canvas id="simCanvas" aria-label="Interactive curl field with rectangular circulation loop"></canvas></div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const stage = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        
        // --- CONFIGURATION ---
        let width, height, cx, cy;
        let SCALE = 50;
        const PARTICLE_COUNT = 650;
        const ARROW_SPACING = 38;
        const LOOP_HALF_WIDTH = 31;
        const LOOP_HALF_HEIGHT = 23;

        // --- STATE ---
        let mouse = { x: 0, y: 0, active: false };
        let currentScene = 0;
        let showFluid = true;
        let loopPhase = 0;
        const conclusions = [
            'A rotating field has positive curl. Circulation around a counterclockwise rectangle is positive.',
            'Horizontal flow changes with height, giving negative curl without a circular pattern.',
            'The shear changes with height, so curl can be positive, negative, or zero at different positions.',
            'Away from its core, the vortex swirls with nearly zero local curl. A loop enclosing the core still has circulation.',
            'Outward expansion has divergence but zero curl: the rectangle does not circulate.',
            'The two wave components create alternating patches of positive and negative curl.'
        ];
        
        // Particles
        const particles = [];
        for(let i=0; i<PARTICLE_COUNT; i++) {
            particles.push({
                x: 0,
                y: 0,
                age: Math.random() * 100
            });
        }

        // --- SCENES ---
        const scenes = [
            // 0: Solid Rotation
            { field: (x, y) => { return { x: -y * 0.5, y: x * 0.5 }; } },
            // 1: Shear Flow
            { field: (x, y) => { return { x: y * 0.5, y: 0 }; } },
            // 2: Variable Shear
            { field: (x, y) => { return { x: Math.sin(y * 0.5), y: 0 }; } },
            // 3: The regularized core has curl; away from it curl approaches zero.
            { field: (x, y) => { 
                let r2 = x*x + y*y + 0.1;
                return { x: -y / r2, y: x / r2 }; 
            }},
            // 4: Expansion (From Divergence Demo)
            // Curl should be zero everywhere!
            { field: (x, y) => { return { x: x * 0.3, y: y * 0.3 }; } },
            // 5: Curl = 0.5[cos(x/2) - cos(y/2)].
            { field: (x, y) => { return { x: Math.sin(y * 0.5), y: Math.sin(x * 0.5) }; } }
        ];

        function getField(screenX, screenY) {
            const u = (screenX - cx) / SCALE;
            const v = -(screenY - cy) / SCALE; // Y flipped
            const vec = scenes[currentScene].field(u, v);
            return { x: vec.x, y: -vec.y, mathX: vec.x, mathY: vec.y };
        }

        function getCurl(screenX, screenY) {
            const h = 1.0; 
            const fRight = getField(screenX + h, screenY);
            const fLeft  = getField(screenX - h, screenY);
            const fUp    = getField(screenX, screenY - h); 
            const fDown  = getField(screenX, screenY + h);

            const dFy_dx = (fRight.mathY - fLeft.mathY) / (2 * h / SCALE);
            const dFx_dy = (fUp.mathX - fDown.mathX) / (2 * h / SCALE);

            return dFy_dx - dFx_dy;
        }

        function getCirculation(screenX, screenY) {
            const x = screenX, y = screenY, w = LOOP_HALF_WIDTH, h = LOOP_HALF_HEIGHT;
            // Counterclockwise in physical x-y coordinates (screen y points down).
            const corners = [[x+w,y-h],[x-w,y-h],[x-w,y+h],[x+w,y+h],[x+w,y-h]];
            let total = 0;
            for (let edge = 0; edge < 4; edge++) {
                const [ax, ay] = corners[edge], [bx, by] = corners[edge + 1];
                for (let i = 0; i < 12; i++) {
                    const t = (i + 0.5) / 12;
                    const field = getField(ax + (bx-ax)*t, ay + (by-ay)*t);
                    total += field.x * (bx-ax) / (12*SCALE) + field.y * (by-ay) / (12*SCALE);
                }
            }
            return total;
        }

        // --- RENDERING ---

        function drawArrow(x, y, vx, vy, color, alpha) {
            const len = Math.sqrt(vx*vx + vy*vy);
            if(len < 0.01) return;
            
            const scale = Math.min(30, len * 20); 
            const nx = (vx / len) * scale;
            const ny = (vy / len) * scale;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = alpha;
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + nx, y + ny);
            ctx.stroke();

            const angle = Math.atan2(ny, nx);
            const headLen = 5;
            ctx.beginPath();
            ctx.moveTo(x + nx, y + ny);
            ctx.lineTo(x + nx - headLen * Math.cos(angle - Math.PI/6), y + ny - headLen * Math.sin(angle - Math.PI/6));
            ctx.lineTo(x + nx - headLen * Math.cos(angle + Math.PI/6), y + ny - headLen * Math.sin(angle + Math.PI/6));
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        function drawLoopArrow(x, y, dx, dy, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + dx*8, y + dy*8);
            ctx.lineTo(x - dx*5 - dy*4, y - dy*5 + dx*4);
            ctx.lineTo(x - dx*5 + dy*4, y - dy*5 - dx*4);
            ctx.closePath();
            ctx.fill();
        }

        function drawRectangleLoop(curl) {
            const x = mouse.x, y = mouse.y, w = LOOP_HALF_WIDTH, h = LOOP_HALF_HEIGHT;
            const color = curl > 0.005 ? '#69f0ae' : curl < -0.005 ? '#ff7070' : '#e2e8f0';
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.4;
            ctx.strokeRect(x-w, y-h, 2*w, 2*h);
            if (Math.abs(curl) > 0.005) {
                const dir = curl > 0 ? 1 : -1;
                drawLoopArrow(x, y-h, -dir, 0, color);
                drawLoopArrow(x-w, y, 0, dir, color);
                drawLoopArrow(x, y+h, dir, 0, color);
                drawLoopArrow(x+w, y, 0, -dir, color);

                // A dot traces the same rectangular integration path.
                loopPhase = (loopPhase + Math.min(0.035, Math.abs(curl)*0.012)*dir + 1) % 1;
                const s = loopPhase * 4*(w+h);
                let px, py;
                if (s < 2*w) { px = x+w-s; py = y-h; }
                else if (s < 2*w+2*h) { px = x-w; py = y-h+s-2*w; }
                else if (s < 4*w+2*h) { px = x-w+s-2*w-2*h; py = y+h; }
                else { px = x+w; py = y+h-s+4*w+2*h; }
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = color;
            ctx.font = 'bold 13px Inter, sans-serif';
            ctx.fillText('A', x+w+7, y-h-5);
        }

        function updateReadout(curl) {
            const valNum = document.getElementById('val-num');
            const descEl = document.getElementById('curl-desc');
            const box = document.getElementById('readout');
            valNum.textContent = (curl > 0 ? '+' : '') + curl.toFixed(2);
            const circulation = getCirculation(mouse.x, mouse.y);
            document.getElementById('circulation-value').textContent =
                `∮ F · dℓ: ${circulation >= 0 ? '+' : ''}${circulation.toFixed(2)}`;

            if (curl > 0.005) {
                valNum.className = "pos";
                box.style.borderLeftColor = "#69f0ae";
                descEl.textContent = 'Positive curl: counterclockwise circulation (⊙).';
            } else if (curl < -0.005) {
                valNum.className = "neg";
                box.style.borderLeftColor = "#ff5252";
                descEl.textContent = 'Negative curl: clockwise circulation (⊗).';
            } else {
                valNum.className = "neu";
                box.style.borderLeftColor = "#fff";
                descEl.textContent = 'Nearly zero local rotation.';
            }
        }

        function resetReadout() {
            document.getElementById('val-num').textContent = '—';
            document.getElementById('val-num').className = 'neu';
            document.getElementById('circulation-value').textContent = '∮ F · dℓ: —';
            document.getElementById('curl-desc').textContent = 'Move the cursor over the field to probe it.';
            document.getElementById('readout').style.borderLeftColor = '#888';
        }

        function loop() {
            // Clear with fade effect
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; 
            ctx.fillRect(0, 0, width, height);

            // 1. Draw Background Vectors
            for (let x = 0; x < width; x += ARROW_SPACING) {
                for (let y = 0; y < height; y += ARROW_SPACING) {
                    const f = getField(x, y);
                    const angle = Math.atan2(f.y, f.x);
                    const hue = (angle * 180 / Math.PI) + 180;
                    const color = `hsl(${hue}, 70%, 60%)`; 
                    drawArrow(x, y, f.x, f.y, color, 0.3);
                }
            }

            // 2. Draw Fluid Particles
            if (showFluid) {
                ctx.fillStyle = "#fff";
                for(let p of particles) {
                    const f = getField(p.x, p.y);
                    p.x += f.x * 3; 
                    p.y += f.y * 3;
                    p.age++;

                    if (p.x < 0 || p.x > width || p.y < 0 || p.y > height || p.age > 100) {
                        p.x = Math.random() * width;
                        p.y = Math.random() * height;
                        p.age = 0;
                    }

                    const alpha = 1 - (p.age / 100);
                    ctx.globalAlpha = alpha * 0.5;
                    ctx.fillRect(p.x, p.y, 2, 2);
                }
                ctx.globalAlpha = 1.0;
            }

            // 3. Draw the circulation path at the pointer.
            if (mouse.active) {
                const curl = getCurl(mouse.x, mouse.y);
                drawRectangleLoop(curl);
                updateReadout(curl);
            }

            requestAnimationFrame(loop);
        }

        // --- EVENTS ---
        window.addEventListener('resize', resize);
        new ResizeObserver(resize).observe(stage);
        canvas.addEventListener('pointermove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });
        canvas.addEventListener('pointerleave', () => { mouse.active = false; resetReadout(); });

        document.getElementById('fluidToggle').addEventListener('change', (e) => {
            showFluid = e.target.checked;
        });

        function resize() {
            const rect = stage.getBoundingClientRect();
            width = Math.max(1, rect.width);
            height = Math.max(1, rect.height);
            SCALE = Math.min(50, width / 8);
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = width / 2;
            cy = height / 2;
            for (const particle of particles) {
                particle.x = Math.random() * width;
                particle.y = Math.random() * height;
            }
        }

        window.setScene = function(idx) {
            currentScene = idx;
            loopPhase = 0;
            document.getElementById('conclusion-text').textContent = conclusions[idx];
            for(let i=0; i<6; i++) {
                const btn = document.getElementById(`btn${i}`);
                if(btn) btn.className = (i===idx) ? 'active' : '';
            }
            if (mouse.active) updateReadout(getCurl(mouse.x, mouse.y));
            else resetReadout();
            ctx.clearRect(0, 0, width, height);
        }

        // Init
        resize();
        mouse.x = cx;
        mouse.y = cy;
        loop();

    </script>
</body>
</html>
